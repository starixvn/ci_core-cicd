deploy_multi_clusters:
  stage: deploy
  trigger:
    include:
      - artifact: $CD_JOBS_FILE_NAME
        job: prepare_cd_jobs
      - cd/.pre/jobs.yml
      - _shared/before_script.yml
      - cd/deploy/luminet/jobs.yml
    strategy: depend
  rules:
    - !reference [.cd_rules, deploy_multi_clusters]
    - !reference [.cd_rules, deploy]