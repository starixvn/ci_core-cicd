include:
  - cd/dast/_definition.yml
  - cd/dast/_vars.yml

dast:
  extends:
    - .zap_scan
  needs:
    - job: prepare_vars
      artifacts: true
    - job: deploy_k8s_argocd
      optional: true
    - job: deploy_swarm
      optional: true
    - job: deploy_k8s
      optional: true
    - job: deploy_multi_clusters
      optional: true