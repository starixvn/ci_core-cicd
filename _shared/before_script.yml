image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash-jq-jinja

before_script:
  - echo $STACK_NAME
  - export DEPLOY_ENV=$CI_ENVIRONMENT_NAME;
  - echo "env $DEPLOY_ENV"
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - echo -e "${SSH_PRIVATE_KEY_1}\n${SSH_PRIVATE_KEY_2}\n${SSH_PRIVATE_KEY_3}" | ssh-add -
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/$DOCKER_IMAGE_PATH_LOCAL
  - export CI_REGISTRY_LOCAL_IMAGE=$DOCKER_REG_LOCAL_URL/$DOCKER_IMAGE_PATH_LOCAL
  - export CI_REGISTRY_IMAGE_VERSION=${CI_COMMIT_SHA:0:8}
  - echo $CI_REGISTRY_IMAGE
  - if [ "$TRANSFORM_CONFIG" == "" ]; then
    export TRANSFORM_CONFIG=$DEPLOY_ENV;
    fi
  - echo $TRANSFORM_CONFIG
  - if [ "$CONFIG_FILE_EXTENSION" == "" ]; then
    export CONFIG_FILE=$CONFIG_FILE_NAME.${TRANSFORM_CONFIG};
    export CONFIG_DEST_FILE=$CONFIG_FILE_NAME;
    else
    export CONFIG_FILE=$CONFIG_FILE_NAME.${TRANSFORM_CONFIG}.$CONFIG_FILE_EXTENSION;
    export CONFIG_DEST_FILE=$CONFIG_FILE_NAME.$CONFIG_FILE_EXTENSION;
    fi
  - if [ "$DOCKER_FILE_PATH" == "" ]; then
    export DOCKER_FILE_PATH=".";
    else
    export DOCKER_FILE_PATH=$DOCKER_FILE_PATH;
    fi
  - echo $CONFIG_FILE
  - echo $DOCKER_FILE_PATH
  - if [ "$DOCKER_FILE_NAME" == "" ]; then
    export DOCKER_FILE_NAME="Dockerfile";
    else
    export DOCKER_FILE_NAME=$DOCKER_FILE_NAME;
    fi
  - echo $DOCKER_FILE_NAME
  - if [ "$DOCKER_NETWORK_NAME" == "" ]; then
    export DOCKER_NETWORK_NAME="bridge";
    else
    export DOCKER_NETWORK_NAME=$DOCKER_NETWORK_NAME;
    fi
  - echo $DOCKER_NETWORK_NAME
  - |
    echo $DEPLOYMENT_API
    echo $REGISTRY_IMAGE
    echo $SERVER_IP
    echo $SERVER_USER
    echo $SERVER_PORT
  - echo $PROXY_SSH_COMMAND
  - if [ "$SERVICE_NAME" == "" ]; then
    echo "$DOCKER_SERVICE_NAME";
    else
    export DOCKER_SERVICE_NAME=$SERVICE_NAME;
    fi
  - if [ "$PROJECT_ROOT_PATH" == "" ]; then
    echo "Root is here";
    else
    cd $PROJECT_ROOT_PATH;
    fi
  - echo $REDMINE_IDS
  - echo "$TRIVY_SERVER - $TRIVY_VERSION";
  - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL;
  - export DOCKER_BUILDKIT=1;
  - echo $DOMAINS;