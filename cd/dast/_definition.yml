.zap_scan:
  variables:
    #Defect Dojo Variable
    DEFECTDOJO_SCAN_TEST_TYPE: "ZAP Scan"
    DEFECTDOJO_SCAN_FILE: "zap-report.xml"
    DEFECTDOJO_SCAN_TYPE: "ZAP Scan"
  stage: dast
  image: $DOCKER_REG_LOCAL_URL/docker-hub/zaproxy/zap-stable:2.16.1
  before_script:
    - echo "Starting ZAP scan preparation"
    - echo "Target URL - $APP_URL"
    - echo "Full scan enabled - $ZAP_FULL_SCAN_ENABLED"
  script:
    - echo "Checking APP_URL availability..."
    - echo "APP_URL = $APP_URL"
    - |
      # Detect which scheme is reachable (HTTP or HTTPS)
      RAW="$APP_URL"
      DOMAIN=$(echo "$RAW" | sed -E 's|^https?://||' | sed -E 's|/.*$||')
      HTTP_URL="http://$DOMAIN"
      HTTPS_URL="https://$DOMAIN"

      HTTPS_CODE=$(curl -skI "$HTTPS_URL" -o /dev/null -w "%{http_code}" --connect-timeout 5 || echo "000")
      HTTP_CODE=$(curl -sI "$HTTP_URL" -o /dev/null -w "%{http_code}" --connect-timeout 5 || echo "000")

      if [ "$HTTPS_CODE" != "000" ]; then
        echo "✅ Target is reachable over HTTPS ($HTTPS_URL), CODE=$HTTPS_CODE"
        DETECTED_SCHEME="https"
        DETECTED_URL="$HTTPS_URL"
      elif [ "$HTTP_CODE" != "000" ]; then
        echo "✅ Target is reachable over HTTP ($HTTP_URL), CODE=$HTTP_CODE"
        DETECTED_SCHEME="http"
        DETECTED_URL="$HTTP_URL"
      else
        echo "❌ Target not reachable over either HTTP or HTTPS"
        echo "Skipping ZAP scan..."
        exit 0
      fi

      echo "Checking if the target is reachable..."
      # Prepare ZAP workspace
      mkdir -p /zap/wrk
      cd /zap/wrk || exit 1

      # Create ZAP configuration (quote EOF to avoid var expansion)
      cat > zap-config.conf << 'EOF'
      # ZAP Baseline Configuration
      # Ignore Info level findings
      # 10015 IGNORE (Incomplete or No Cache-control and Pragma HTTP Header Set)
      # 10027 IGNORE (Information Disclosure - Suspicious Comments)
      # 10109 IGNORE (Modern Web Application)
      EOF

      # Run ZAP scan against detected URL
      if [ "$ZAP_FULL_SCAN_ENABLED" = "true" ]; then
        echo "Starting ZAP FULL scan on $DETECTED_URL..."
        zap-full-scan.py -t "$DETECTED_URL" -x "zap-report.xml" -I -c "zap-config.conf" || echo "⚠️ ZAP full scan encountered issues"
      else
        echo "Starting ZAP baseline scan on $DETECTED_URL..."
        zap-baseline.py -t "$DETECTED_URL" -x "zap-report.xml" -I -c "zap-config.conf" || echo "⚠️ ZAP baseline scan encountered issues"
      fi
      echo "✅ ZAP scan completed"
    - cat zap-config.conf
    - cat "zap-report.xml"
    - !reference [.defectdojo_upload, script]
  tags:
    - docker
