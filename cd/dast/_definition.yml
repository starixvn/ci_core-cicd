.zap_scan:
  variables:
    #Defect Dojo Variable
    DEFECTDOJO_SCAN_TEST_TYPE: "ZAP Scan"
    DEFECTDOJO_SCAN_FILE: "zap-report.xml"
    DEFECTDOJO_SCAN_TYPE: "ZAP Scan"
  stage: dast
  image: $DOCKER_REG_LOCAL_URL/docker-hub/zaproxy/zap-stable:2.16.1
  before_script:
    - echo "Starting ZAP scan preparation"
    - echo "Target URL - $APP_URL"
    - echo "Full scan enabled - $ZAP_FULL_SCAN_ENABLED"
  script:
    - echo "Checking APP_URL availability..."
    - echo "APP_URL = $APP_URL"
    - |
      # Prepare ZAP workspace
      mkdir -p /zap/wrk
      cd /zap/wrk || exit 1

      # Create ZAP configuration to filter unnecessary findings
      cat > zap-config.conf << 'EOF'
      # ZAP Configuration - Focus on High/Critical findings
      # Ignore common Info/Low level findings

      # Ignore Info level findings
      10015 IGNORE (Incomplete or No Cache-control and Pragma HTTP Header Set)
      10027 IGNORE (Information Disclosure - Suspicious Comments)
      10109 IGNORE (Modern Web Application)
      10021 IGNORE (X-Content-Type-Options Header Missing)
      10020 IGNORE (X-Frame-Options Header)
      10038 IGNORE (Content Security Policy (CSP) Header Not Set)
      10094 IGNORE (Base64 Disclosure)

      # Ignore common Low level findings
      10017 IGNORE (Cross-Domain JavaScript Source File Inclusion)
      10024 IGNORE (Information Disclosure - Sensitive Information in URL)
      10025 IGNORE (Information Disclosure - Sensitive Information in HTTP Referrer Header)
      EOF

      # Run ZAP scan against APP_URL
      echo "🔍 Starting ZAP scan on $APP_URL..."
      if [ "$ZAP_FULL_SCAN_ENABLED" = "true" ]; then
        zap-full-scan.py -t "$APP_URL" -x "zap-report.xml" -I -c "zap-config.conf" || echo "⚠️ ZAP full scan encountered issues"
      else
        zap-baseline.py -t "$APP_URL" -x "zap-report.xml" -I -c "zap-config.conf" || echo "⚠️ ZAP baseline scan encountered issues"
      fi
      
      # Copy report to project directory
      cp "zap-report.xml" "$CI_PROJECT_DIR/"
      echo "✅ ZAP scan completed"
    - !reference [.defectdojo_upload, script]
  tags:
    - docker


