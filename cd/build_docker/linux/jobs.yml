include:
  - cd/build_docker/linux/_definition.yml
  - cd/build_docker/linux/report_defectdojo/_definition.yml
  - cd/build_docker/linux/report_defectdojo/_vars.yml


build_multistage_env:
  extends:
    - .build:default:image:multistage
    - .env
  needs: ["prepare_vars"]
  rules: 
    - !reference [.cd_rules, build_multistage]
    - !reference [.cd_rules, build_env]
    - !reference [.cd_rules, build_linux]
    - !reference [.cd_rules, deploy]

build_multistage_noenv:
  extends:
    - .build:default:image:noenv:multistage
    - .env
  needs: ["prepare_vars"]
  rules:
    - !reference [.cd_rules, build_multistage]
    - !reference [.cd_rules, build_noenv]
    - !reference [.cd_rules, build_linux]
    - !reference [.cd_rules, deploy]

build_noenv:
  extends:
    - .build:default:image:noenv
    - .env
  needs: ["prepare_vars"]
  rules:
    - !reference [.cd_rules, build_no_multistage]
    - !reference [.cd_rules, build_noenv]
    - !reference [.cd_rules, build_linux]
    - !reference [.cd_rules, deploy]

build_env:
  extends:
    - .build:default:image
    - .env
  needs: ["prepare_vars"]
  rules:
    - !reference [.cd_rules, build_no_multistage]
    - !reference [.cd_rules, build_env]
    - !reference [.cd_rules, build_linux]
    - !reference [.cd_rules, deploy]