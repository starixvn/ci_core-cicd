.prepare_variables: &prepare_variables
  - |
    ENV_VERSION_NAME=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    FORMATED_APP_NAME=$(echo "$APP_NAME" | sed 's/_/-/g')

.generate_template_helper: &generate_template_helper
  - |
    generate_argocd_template() {
      local app_name="$1"
      local env_name="$2"
      local src_path="$3"
      local output_file="$4"

      echo "Generating $ARGOCD_APP_TEMPLATE_FILE_NAME for $app_name...";
      curl --fail -o ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_TEMPLATE_FILE_PATH/raw?ref=$ARGOCD_REF
      sed -i "s/@APP_NAME/$app_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@STACK_NAME/$STACK_NAME/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@ENV_NAME/$env_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@ARGO_CLUSTER/$ARGO_CLUSTER/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s|@SRC_PATH|$src_path|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s|@SRC_REPO_URL|$ARGOCD_REPO_URL|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 -o ./${output_file}
    }

.generate-argocd-template-file: &generate-argocd-template-file
  - *generate_template_helper
  - |
    generate_argocd_template "$NAMESPACE_IMAGE_PULL_SECRETS_CHART_NAME" "${ENV_VERSION_NAME//[0-9]/}" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_ROOT_FOLDER/$STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_TEMPLATE_FILE_NAME"
    generate_argocd_template "$FORMATED_APP_NAME" "${ENV_VERSION_NAME}" "$APPLICATION_PATH" "$ARGOCD_APP_TEMPLATE_FILE_NAME"

.generate_chart_helper: &generate_chart_helper
  - |
    generate_argocd_chart() {
      local app_name="$1"
      local dep_name="$2"
      local dep_version="$3"
      local output_file="$4"

      echo "Generating $ARGOCD_APP_CHART_FILE_NAME for $app_name...";
      curl --fail -o ${ARGOCD_APP_CHART_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_CHART_FILE_PATH/raw?ref=$ARGOCD_REF
      sed -i "s/@APP_NAME/$app_name/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      sed -i "s/@DEP_NAME/$dep_name/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      sed -i "s/@DEP_VERSION/$dep_version/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2 -o ./${output_file}
    }

.generate-argocd-chart-file: &generate-argocd-chart-file
  - *generate_chart_helper
  - |
    generate_argocd_chart "$NAMESPACE_IMAGE_PULL_SECRETS_CHART_NAME" "$NAMESPACE_IMAGE_PULL_SECRETS_CHART_NAME" "$NAMESPACE_IMAGE_PULL_SECRETS_CHART_VERSION" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_CHART_FILE_NAME"
    generate_argocd_chart "$FORMATED_APP_NAME" "$K8S_DEPLOYMENTS_CHART_NAME" "$K8S_DEPLOYMENTS_CHART_VERSION" "$ARGOCD_APP_CHART_FILE_NAME"

.generate-argocd-values-file: &generate-argocd-values-file
  - |
    echo "Generating $ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME...";
    curl --fail -o ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    sed -i "s/@REGISTRY_USERNAME/$DOCKER_REG_LOCAL_USERNAME/g" ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    sed -i "s/@REGISTRY_PASSWORD/$DOCKER_REG_LOCAL_PASSWORD/g" ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2 -o ./${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}
  - |
    echo "Generating $ARGOCD_K8S_FILE_NAME...";
    curl --fail -o ${ARGOCD_K8S_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_K8S_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${ARGOCD_K8S_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME}.preview
    cat $ARGOCD_K8S_FILE_NAME.preview
    if [ ! -z "$SP_FILE_NAME" ];
    then
      awk -v sp_content="$(< "$SP_FILE_PATH/$SP_FILE")" '{gsub(/@SP_CONTENT/, sp_content); print}' "${ARGOCD_K8S_FILE_NAME}.j2" > "${ARGOCD_K8S_FILE_NAME}.j2.tmp" && mv "${ARGOCD_K8S_FILE_NAME}.j2.tmp" "${ARGOCD_K8S_FILE_NAME}.j2"
    fi
    if [ ! -z "$CONFIG_FILE_NAME" ];
    then
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME} -e "config_content='$(< "$CONFIG_FILE_PATH/$CONFIG_FILE")'"
    else
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME}
    fi

.clone_argocd_repo: &clone_argocd_repo
  - |
    echo "Cloning ArgoCD repository..."
    ARGOCD_REPO_HOST=$(echo $ARGOCD_REPO_URL | sed 's|https://||')
    git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${ARGOCD_REPO_HOST} $ARGOCD_ROOT_FOLDER
    cd $ARGOCD_ROOT_FOLDER

.copy_file_helper: &copy_file_helper
  - |
    copy_file() {
      local source_file="$1"
      local dest_path="$2"
      local dest_dir=$(dirname "$dest_path")

      if [ ! -d "$dest_dir" ];
      then
        echo "Creating folder: $dest_dir"
        mkdir -p "$dest_dir"
      fi
      echo "Copying $source_file to $dest_path..."
      cp "../$source_file" "$dest_path"
    }

.copy_template_file: &copy_template_file
  - |
    copy_file "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_TEMPLATE_FILE_NAME" "applications/templates/$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_ROOT_FOLDER/$STACK_NAME/${ENV_VERSION_NAME//[0-9]/}.yaml"
    copy_file "$ARGOCD_APP_TEMPLATE_FILE_NAME" "applications/templates/$APPLICATION_PATH/${ENV_VERSION_NAME}.yaml"

.copy_values_file: &copy_values_file
  - |
    copy_file "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME" "charts/$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_ROOT_FOLDER/$STACK_NAME/values-${ENV_VERSION_NAME//[0-9]/}.yaml"
    copy_file "$ARGOCD_K8S_FILE_NAME" "charts/$APPLICATION_PATH/values-${ENV_VERSION_NAME}.yaml"

.copy_chart_file: &copy_chart_file
  - |
    copy_file "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_CHART_FILE_NAME" "charts/$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_ROOT_FOLDER/$STACK_NAME/Chart.yaml"
    copy_file "$ARGOCD_APP_CHART_FILE_NAME" "charts/$APPLICATION_PATH/Chart.yaml"

.push_to_argocd_repo: &push_to_argocd_repo
  - |
    if [ -n "$(git status --porcelain)" ];
    then
      echo "Pushing to ArgoCD repository..."
      git config user.email $ROCKETOR_GIT_EMAIL
      git config user.name $ROCKETOR_GIT_USER
      git add -A
      git commit -m "[${ACTION_TYPE}-${STACK_NAME}-${FORMATED_APP_NAME}-${ENV_VERSION_NAME}-${CI_COMMIT_SHORT_SHA}] $TRIGGER_BY $CI_COMMIT_MESSAGE"

      MAX_RETRIES=10
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ];
      do
        echo "Pulling latest changes from remote repository..."
        git pull origin main --rebase
        echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES to push changes..."
        if git push origin main;
        then
          break
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ];
          then
            SLEEP_TIME=$((RANDOM % 5 + 1))
            echo "Waiting $SLEEP_TIME seconds before retrying..."
            sleep $SLEEP_TIME
          fi
        fi
      done

      if [ $RETRY_COUNT -eq $MAX_RETRIES ];
      then
        echo "Failed to push to ArgoCD repository after $MAX_RETRIES attempts."
        exit 1
      fi
    else
      echo "No changes detected. Skipping commit and push."
    fi

.sync_argocd_app_helper: &sync_argocd_app_helper
  - |
    sync_argocd_app() {
      local app_name="$1"
      local template_file="$2"
      local force_sync="${3:-false}"

      if [ $ACTION_TYPE == "deploy" ];
      then
        echo "===== $app_name: Creating application if not exists... ====="
        argocd app create -f "../$template_file" --upsert
      fi

      if [ "$force_sync" == "true" ] || ! argocd app diff "$app_name" --exit-code > /dev/null;
      then
        echo "===== $app_name: Triggering sync... ====="
        argocd app sync "$app_name" --prune
      fi

      echo "===== $app_name: Waiting for application sync and healthy status... ====="
      argocd app wait "$app_name" --sync --health --timeout $ARGOCD_SYNC_TIMEOUT
    }

.sync_argocd_app: &sync_argocd_app
  - |
    echo "ArgoCD Server: $ARGOCD_SERVER"
    export ARGOCD_OPTS="--grpc-web"
  - *sync_argocd_app_helper
  - |
    sync_argocd_app "${STACK_NAME}-${NAMESPACE_IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_VERSION_NAME//[0-9]/}" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_TEMPLATE_FILE_NAME"
    sync_argocd_app "${STACK_NAME}-${FORMATED_APP_NAME}-${ENV_VERSION_NAME}" "$ARGOCD_APP_TEMPLATE_FILE_NAME" "true"

.process_sync_argocd_application: &process_sync_argocd_application
  - *prepare_variables
  - *clone_argocd_repo
  - *copy_file_helper
  - *copy_values_file
  - *push_to_argocd_repo
  - *sync_argocd_app

.prepare_argocd_app_file:
  script:
    - echo "===== PREPARING ARGOCD APP FILE ... ====="
    - echo $VARS_DATA > VARS_DATA.json
    - *prepare_variables
    - *generate-argocd-template-file
    - *generate-argocd-chart-file
    - *generate-argocd-values-file

.prepare_argocd_values_file:
  script:
    - echo "===== PREPARING ARGOCD VALUES FILE ... ====="
    - echo $VARS_DATA > VARS_DATA.json
    - *generate-argocd-values-file

.deploy_argocd_application:
  script:
    - echo "===== DEPLOY ARGOCD APPLICATION ... ====="
    - ACTION_TYPE=deploy
    - *prepare_variables
    - *clone_argocd_repo
    - *copy_file_helper
    - *copy_template_file
    - *copy_chart_file
    - *copy_values_file
    - *push_to_argocd_repo
    - *sync_argocd_app

.update_k8s_ingress_argocd:
  script:
    - echo "===== UPDATE INGRESS ARGOCD APPLICATION ... ====="
    - ACTION_TYPE=update-ingress
    - *process_sync_argocd_application

.sync_argocd_application:
  script:
    - echo "===== SYNC ARGOCD APPLICATION ... ====="
    - ACTION_TYPE=sync-argo-app
    - *process_sync_argocd_application
