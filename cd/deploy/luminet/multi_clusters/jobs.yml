deploy_multi_clusters:
  stage: deploy
  variables:
    DEPLOY_BY: $DEPLOY_BY
    DEPLOY_VERSION: $DEPLOY_VERSION
    ENV_NAME: $ENV_NAME
    STACK_NAME: $STACK_NAME
    TRANSFORM_CONFIG: $TRANSFORM_CONFIG
    VARS_DATA: $VARS_DATA
  trigger:
    include:      
      - artifact: $CD_JOBS_FILE_NAME
        job: prepare_cd_jobs
      - project: ci/core-cicd
        ref: argocd
        file: 'cd/deploy/luminet/multi_clusters/_mixing.yml'
    strategy: depend
  rules:
    - !reference [.cd_rules, deploy_multi_clusters]
    - !reference [.cd_rules, deploy]