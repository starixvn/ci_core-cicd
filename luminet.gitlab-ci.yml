include:
  - _mixing.yml
  - ci/unit_test/cocos/jobs.yml
  - cd/build_cocos/jobs.yml
  - cd/transform_config/jobs.yml
  - cd/deploy/luminet/jobs.yml
  - cd/deploy/luminet/multi_clusters/jobs.yml
  - cd/smoke_test/jobs.yml
  - cd/auto_deploy/jobs.yml
  - cd/sync_tolgee/jobs.yml
  - cd/publish_npm/jobs.yml

build_multistage_env:
  needs:
    - "prepare_vars"
    - job: "transform_config"
      artifacts: true
      optional: true
    - job: "sync_tolgee"
      artifacts: true
      optional: true

build_multistage_noenv:
  needs:
    - "prepare_vars"
    - job: "sync_tolgee"
      artifacts: true
      optional: true

build_env:
  needs:
    - "prepare_vars"
    - job: "transform_config"
      artifacts: true
      optional: true
    - job: "build_cocos_env"
      artifacts: true
      optional: true
    - job: "sync_tolgee"
      artifacts: true
      optional: true

build_noenv:
  needs:
    - "prepare_vars"
    - job: "build_cocos_env"
      artifacts: true
      optional: true
    - job: "sync_tolgee"
      artifacts: true
      optional: true

unit_test_js:
  allow_failure: false

unit_test_dotnet:
  allow_failure: false