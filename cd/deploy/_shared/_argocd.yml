# region: Helper functions
.download_file_helper: &download_file_helper
  - |
    download_file() {
      local file_path="$1"
      local output_file="$2"

      echo "Downloading $file_path..."
      local encoded_project_path=$(jq -rn --arg v "ci/core-cicd" '$v|@uri')
      local encoded_file_path=$(jq -rn --arg v "$file_path" '$v|@uri')
      curl -s --fail -o "$output_file" --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" "$GITLAB_API_URL/projects/$encoded_project_path/repository/files/$encoded_file_path/raw?ref=$ARGOCD_REF"
    }

.is_argocd_repo_exist_helper: &is_argocd_repo_exist_helper
  - |
    is_argocd_repo_exist() {
      local app_name="$1"

      local repo_name="$FORMATTED_STACK_NAME-$app_name"
      local var_name="ARGOCD_REPO_EXIST_${repo_name//-/_}"

      echo "${!var_name:-false}"
    }

.generate_argocd_template_helper: &generate_argocd_template_helper
  - |
    generate_argocd_template() {
      local stack_name="$1"
      local app_name="$2"
      local env_name="$3"
      local cluster_name="$4"
      local output_file="$5"

      if [ "$(is_argocd_repo_exist "$app_name")" == "true" ]; then
        return
      fi

      local repo_name="$stack_name-$app_name"
      local src_repo_url="$ARGOCD_GROUP_URL/$repo_name.git"
      local argocd_app_name="$stack_name-$app_name-$env_name"

      echo "Generating $ARGOCD_APP_TEMPLATE_FILE_NAME for $argocd_app_name...";
      cp ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp
      sed -i "s/@APP_NAME/$app_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp
      sed -i "s/@STACK_NAME/$stack_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp
      sed -i "s/@ENV_NAME/$env_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp
      sed -i "s/@ARGO_CLUSTER/$cluster_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp
      sed -i "s|@SRC_REPO_URL|$src_repo_url|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp
      jinja render -t ./${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2.tmp -o ./${output_file}
    }

.generate_argocd_chart_helper: &generate_argocd_chart_helper
  - |
    generate_argocd_chart() {
      local app_name="$1"
      local dep_name="$2"
      local dep_version="$3"
      local output_file="$4"

      if [ "$(is_argocd_repo_exist "$app_name")" == "true" ]; then
        return
      fi

      echo "Generating $ARGOCD_APP_CHART_FILE_NAME for $app_name...";
      cp ${ARGOCD_APP_CHART_FILE_NAME}.j2 ${ARGOCD_APP_CHART_FILE_NAME}.j2.tmp
      sed -i "s/@APP_NAME/$app_name/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2.tmp
      sed -i "s|@REGISTRY_URL|$DOCKER_REG_LOCAL_URL|g" ${ARGOCD_APP_CHART_FILE_NAME}.j2.tmp
      sed -i "s/@DEP_NAME/$dep_name/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2.tmp
      sed -i "s/@DEP_VERSION/$dep_version/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2.tmp
      jinja render -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2.tmp -o ./${output_file}
    }

.replace_file_content_helper: &replace_file_content_helper
  - |
    replace_file_content() {
      local placeholder="$1"
      local source_file_name="$2"
      local source_file="$3"
      local target_file="$4"

      if [ ! -z "$source_file_name" ];
      then
        if [ -f "$source_file" ];
        then
          awk '
            /^'"$placeholder"'$/ {
              while ((getline line < "'"$source_file"'") > 0) {
                print line
              }
              close("'"$source_file"'")
              next
            }
            { print }
          ' "$target_file" > "${target_file}.tmp" && mv "${target_file}.tmp" "$target_file"
        else
          echo ""
          echo "File $source_file does not exist."
          exit 1
        fi
      else
        sed -i "s/$placeholder//g" "$target_file"
      fi
    }

.create_argocd_repo_helper: &create_argocd_repo_helper
  - |
    create_argocd_repo() {
      local stack_name="$1"
      local app_name="$2"

      if [ "$(is_argocd_repo_exist "$app_name")" == "true" ]; then
        return
      fi

      local project_name="$stack_name-$app_name"
      local project_path="$ARGOCD_GROUP_PATH/$project_name"

      echo "Creating GitLab project if not exists $project_path..."

      local encoded_project_path=$(jq -rn --arg v "$project_path" '$v|@uri')
      local project_exists=$(curl -s --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" "$GITLAB_API_URL/projects/$encoded_project_path" | jq -r '.id // empty')

      if [ -n "$project_exists" ]; then
        echo "Project $project_path already exists"
      else
        local encoded_group_path=$(jq -rn --arg v "$ARGOCD_GROUP_PATH" '$v|@uri')
        local group_id=$(curl -s --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" "$GITLAB_API_URL/groups/$encoded_group_path" | jq -r '.id')

        curl -s --request POST \
          --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{
            \"name\": \"$project_name\",
            \"namespace_id\": $group_id
          }" \
          "$GITLAB_API_URL/projects" > /dev/null

        echo "Successfully created project $project_path"
      fi
    }

.clone_argocd_repo_helper: &clone_argocd_repo_helper
  - |
    clone_argocd_repo() {
      local stack_name="$1"
      local app_name="$2"

      local repo_name=$stack_name-$app_name
      local repo_host=$CI_SERVER_HOST/$ARGOCD_GROUP_PATH/$repo_name.git

      echo "Cloning ArgoCD repository $repo_name..."
      git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${repo_host} $repo_name
    }

.copy_file_helper: &copy_file_helper
  - |
    copy_file() {
      local type="$1"
      local stack_name="$2"
      local app_name="$3"
      local source_file="$4"
      local dest_file="$5"

      if [[ "$dest_file" != values-*.yaml ]] && [ "$(is_argocd_repo_exist "$app_name")" == "true" ]; then
        return
      fi

      local dest_path="$stack_name-$app_name/$type/$dest_file"
      local dest_dir=$(dirname "$dest_path")

      if [ ! -d "$dest_dir" ];
      then
        echo "Creating folder: $dest_dir"
        mkdir -p "$dest_dir"
      fi
      echo "Copying $source_file to $dest_path..."
      cp "$source_file" "$dest_path"
    }

.push_to_argocd_repo_helper: &push_to_argocd_repo_helper
  - |
    push_to_argocd_repo() {
      local stack_name="$1"
      local app_name="$2"
      local env_name="$3"
      local trigger_by="$4"

      local repo_name="$stack_name-$app_name"

      cd $repo_name
      git config user.email $ROCKETOR_GIT_EMAIL
      git config user.name $ROCKETOR_GIT_USER

      if ! git ls-remote --heads origin main | grep -q main; then
        echo "Remote main branch doesn't exist, creating initial commit..."
        git commit --allow-empty -m "Initial commit"
        git push -u origin main
      fi

      if [ -n "$(git status --porcelain)" ];
      then
        echo "Pushing to ArgoCD repository $repo_name..."
        git add -A
        git commit -m "[${ACTION_TYPE}-${stack_name}-${app_name}-${env_name}-${CI_COMMIT_SHORT_SHA}] $trigger_by $CI_COMMIT_MESSAGE"

        local max_retries=10
        local retry_count=0

        while [ $retry_count -lt $max_retries ];
        do
          echo "Pulling latest changes from remote repository..."
          git pull origin main --rebase
          echo "Attempt $((retry_count + 1)) of $max_retries to push changes."
          if git push origin main;
          then
            break
          else
            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ];
            then
              local sleep_time=$((RANDOM % 5 + 1))
              echo "Waiting $sleep_time seconds before retrying..."
              sleep $sleep_time
            fi
          fi
        done

        if [ $retry_count -eq $max_retries ];
        then
          echo "Failed to push to ArgoCD repository after $max_retries attempts."
          exit 1
        fi
      else
        echo "No changes detected in $repo_name. Skipping commit and push."
      fi

      cd ..
    }

.retry_command_helper: &retry_command_helper
  - |
    retry_command() {
      local command="$1"
      local max_retries="${2:-3}"
      local base_delay="${3:-5}"
      local max_delay="${4:-60}"

      local retry_count=0

      while [ $retry_count -lt $max_retries ]; do
        echo "Attempt $((retry_count + 1)) of $max_retries: $command"

        if eval "$command"; then
          return 0
        fi

        retry_count=$((retry_count + 1))

        if [ $retry_count -lt $max_retries ]; then
          # Calculate delay with exponential backoff: base_delay * 2^retry_count, capped at max_delay
          local delay=$(( base_delay * (1 << retry_count) ))

          if [ $delay -gt $max_delay ]; then
            delay=$max_delay
          fi

          echo "Command failed. Retrying in $delay seconds..."
          sleep $delay
        else
          echo "Command failed after $max_retries attempts"
          return 1
        fi
      done
    }

.create_argocd_app_helper: &create_argocd_app_helper
  - |
    create_argocd_app() {
      local stack_name="$1"
      local app_name="$2"
      local env_name="$3"
      local template_file="$4"

      if [ "$(is_argocd_repo_exist "$app_name")" == "true" ]; then
        return
      fi

      local argocd_app_name=$stack_name-$app_name-$env_name

      echo "===== $argocd_app_name: Creating application if not exists... ====="
      retry_command "argocd app create -f $template_file --upsert"
      if [ $? -ne 0 ]; then
        echo "Failed to create ArgoCD application $argocd_app_name after retries"
        exit 1
      fi
    }

.sync_argocd_app_helper: &sync_argocd_app_helper
  - |
    sync_argocd_app() {
      local stack_name="$1"
      local app_name="$2"
      local env_name="$3"
      local force_sync="$4"

      local argocd_app_name=$stack_name-$app_name-$env_name

      if [ "$force_sync" == "true" ] || ! argocd app diff $argocd_app_name --exit-code > /dev/null;
      then
        echo "===== $argocd_app_name: Triggering sync... ====="
        retry_command "argocd app sync $argocd_app_name --prune"
        if [ $? -ne 0 ]; then
          echo "Failed to sync ArgoCD application $argocd_app_name after retries"
          exit 1
        fi
      fi

      echo "===== $argocd_app_name: Waiting for application sync and healthy status... ====="
      argocd app wait $argocd_app_name --sync --health --timeout $ARGOCD_SYNC_TIMEOUT
    }

.delete_argocd_app_helper: &delete_argocd_app_helper
  - |
    delete_argocd_app() {
      local stack_name="$1"
      local app_name="$2"
      local env_name="$3"

      local argocd_app_name=$stack_name-$app_name-$env_name

      echo "===== $argocd_app_name: Deleting application... ====="
      retry_command "argocd app delete $argocd_app_name"
      if [ $? -ne 0 ]; then
        echo "Failed to delete ArgoCD application $argocd_app_name after retries"
        exit 1
      fi
    }

.declare_argocd_repo_exist_var_helper: &declare_argocd_repo_exist_var_helper
  - |
    declare_argocd_repo_exist_var() {
      local app_name="$1"

      local repo_name="$FORMATTED_STACK_NAME-$app_name"
      local var_name="ARGOCD_REPO_EXIST_${repo_name//-/_}"
      local project_path="$ARGOCD_GROUP_PATH/$repo_name"
      local encoded_project_path=$(jq -rn --arg v "$project_path" '$v|@uri')
      local project_exists=$(curl -s --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" "$GITLAB_API_URL/projects/$encoded_project_path" | jq -r '.id // empty')

      declare -g "${var_name}=$([ -n "$project_exists" ] && echo "true" || echo "false")"
    }

# region: Shared configmaps
.add_file_to_group_helper: &add_file_to_group_helper
  - |
    add_file_to_group() {
      local files_group_data="$1"
      local stack="$2"
      local type="$3"
      local version="$4"
      local cluster="$5"
      local file_name="$6"
      local file_content="$7"

      echo "$files_group_data" | jq \
        --arg key "${stack}-${type}-${version}" \
        --arg stack "$stack" \
        --arg type "$type" \
        --arg version "$version" \
        --arg cluster "$cluster" \
        --arg file_name "$file_name" \
        --argjson file_content "$file_content" '
        if (map(select(.key == $key)) | length) == 0 then
          . + [{
            key: $key,
            stack: $stack,
            type: $type,
            version: $version,
            cluster: $cluster,
            files: [{name: $file_name, content: $file_content}]
          }]
        else
          map(
            if .key == $key then
              .files += [{name: $file_name, content: $file_content}]
            else . end
          )
        end
      '
    }

.group_versions_helper: &group_versions_helper
  - |
    group_versions() {
      local changed_files="$1"
      local versions_group="[]"
      local file dir_path type stack file_name version

      while IFS= read -r file; do
        [[ ! "$file" =~ ^$SHARED_CONFIGMAPS_ROOT_FOLDER/ ]] && continue

        dir_path=$(dirname "$file")
        type=$(echo "$dir_path" | cut -d '/' -f 2)
        stack=$(echo "$dir_path" | cut -d '/' -f 3)
        file_name=$(basename "$file")
        version=$(echo "$file_name" | cut -d '.' -f 2 | tr '[:upper:]' '[:lower:]' | sed 's/_//g')

        versions_group=$(echo "$versions_group" | jq \
          --arg key "${stack}-${type}" \
          --arg stack "$stack" \
          --arg type "$type" \
          --arg version "$version" '
          if (map(select(.key == $key)) | length) == 0 then
            . + [{key: $key, stack: $stack, type: $type, versions: [$version]}]
          else
            map(
              if .key == $key then
                .versions += (if (.versions | index($version)) then [] else [$version] end)
              else . end
            )
          end
        ')
      done <<< "$changed_files"

      echo "$versions_group"
    }

.group_files_helper: &group_files_helper
  - |
    group_files() {
      local deleted_files="$1"
      local grouped_versions_data="$2"
      local files_group="[]"
      local app stack type version environment cluster
      local config_file config_file_name file_version config_file_content
      local deleted_file dir_path file_type file_stack file_name

      while IFS= read -r app; do
        stack=$(echo "$app" | jq -r '.stack')
        type=$(echo "$app" | jq -r '.type')

        while IFS= read -r version; do
          environment=$(echo "$version" | sed 's/[0-9]//g')
          cluster=$(echo "$ARGOCD_CLUSTERS" | jq -r --arg env "$environment" '.[] | select(.env == $env) | .name')

          # Process regular files
          for config_file in $SHARED_CONFIGMAPS_ROOT_FOLDER/$type/$stack/*.*.*; do
            [ ! -f "$config_file" ] || [ ! -s "$config_file" ] && continue

            config_file_name=$(basename "$config_file")
            file_version=$(echo "$config_file_name" | cut -d '.' -f 2 | tr '[:upper:]' '[:lower:]' | sed 's/_//g')

            [ "$file_version" != "$version" ] && continue

            config_file_content=$(cat "$config_file" | jq -Rs .)
            files_group=$(add_file_to_group "$files_group" "$stack" "$type" "$version" "$cluster" "$config_file_name" "$config_file_content")
          done

          # Process deleted files
          while IFS= read -r deleted_file; do
            [[ ! "$deleted_file" =~ ^$SHARED_CONFIGMAPS_ROOT_FOLDER/ ]] && continue

            dir_path=$(dirname "$deleted_file")
            file_type=$(echo "$dir_path" | cut -d '/' -f 2)
            file_stack=$(echo "$dir_path" | cut -d '/' -f 3)

            [ "$file_type" != "$type" ] || [ "$file_stack" != "$stack" ] && continue

            file_name=$(basename "$deleted_file")
            file_version=$(echo "$file_name" | cut -d '.' -f 2 | tr '[:upper:]' '[:lower:]' | sed 's/_//g')

            [ "$file_version" != "$version" ] && continue

            files_group=$(add_file_to_group "$files_group" "$stack" "$type" "$version" "$cluster" "$file_name" '""')
          done <<< "$deleted_files"
        done < <(echo "$app" | jq -r '.versions[]')
      done < <(echo "$grouped_versions_data" | jq -c '.[]')

      echo "$files_group"
    }
# endregion
# endregion

# region: Actions
.prepare_variables: &prepare_variables
  - |
    ENV_VERSION_NAME=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    FORMATTED_STACK_NAME=$(echo "$STACK_NAME" | sed 's/_/-/g')
    FORMATTED_APP_NAME=$(echo "$APP_NAME" | sed 's/_/-/g')
    FORMATTED_DEPARTMENT=$(echo "$DEPARTMENT" | tr '[:upper:]' '[:lower:]' | sed 's/ - /-/g' | sed 's/ /-/g' | sed 's/_/-/g')
    FORMATTED_ENV_NAME=$(echo "$ENV_NAME" | tr '[:upper:]' '[:lower:]')
    ARGOCD_GROUP_PATH=$(echo "$ARGOCD_GROUP_URL" | sed "s|$CI_SERVER_URL/||g")
    export ARGOCD_OPTS="--grpc-web"

.prepare_helpers: &prepare_helpers
  - *declare_argocd_repo_exist_var_helper
  - *is_argocd_repo_exist_helper
  - *download_file_helper
  - *replace_file_content_helper
  - *copy_file_helper
  - *retry_command_helper
  - *generate_argocd_template_helper
  - *generate_argocd_chart_helper
  - *create_argocd_repo_helper
  - *clone_argocd_repo_helper
  - *push_to_argocd_repo_helper
  - *create_argocd_app_helper
  - *sync_argocd_app_helper
  - *delete_argocd_app_helper

.declare_argocd_repo_exist_var: &declare_argocd_repo_exist_var
  - |
    declare_argocd_repo_exist_var "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME"
    declare_argocd_repo_exist_var "$FORMATTED_APP_NAME"

.generate_argocd_template_file: &generate_argocd_template_file
  - |
    download_file "$ARGOCD_APP_TEMPLATE_FILE_PATH" "${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2"
    generate_argocd_template "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "${FORMATTED_ENV_NAME}" "$ARGO_CLUSTER" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_TEMPLATE_FILE_NAME"
    generate_argocd_template "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME" "${ENV_VERSION_NAME}" "$ARGO_CLUSTER" "$ARGOCD_APP_TEMPLATE_FILE_NAME"

.generate_argocd_chart_file: &generate_argocd_chart_file
  - |
    download_file "$ARGOCD_APP_CHART_FILE_PATH" "${ARGOCD_APP_CHART_FILE_NAME}.j2"
    generate_argocd_chart "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "$NAMESPACE_IMAGE_PULL_SECRETS_CHART_NAME" "$NAMESPACE_IMAGE_PULL_SECRETS_CHART_VERSION" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_CHART_FILE_NAME"
    generate_argocd_chart "$FORMATTED_APP_NAME" "$K8S_DEPLOYMENTS_CHART_NAME" "$K8S_DEPLOYMENTS_CHART_VERSION" "$ARGOCD_APP_CHART_FILE_NAME"

.generate_argocd_values_file: &generate_argocd_values_file
  - |
    download_file "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_PATH" "${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2"
    echo "Generating $ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME...";
    cp ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2 ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2.tmp
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2.tmp
    sed -i "s/@REGISTRY_USERNAME/$DOCKER_REG_LOCAL_USERNAME/g" ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2.tmp
    sed -i "s/@REGISTRY_PASSWORD/$DOCKER_REG_LOCAL_PASSWORD/g" ${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2.tmp
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}.j2.tmp -o ./${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME}
  - |
    download_file "$ARGOCD_K8S_FILE_PATH" "${ARGOCD_K8S_FILE_NAME}.j2"
    echo "Generating $ARGOCD_K8S_FILE_NAME...";
    cp ${ARGOCD_K8S_FILE_NAME}.j2 ${ARGOCD_K8S_FILE_NAME}.j2.tmp
    sed -i "s/@DEPARTMENT/$FORMATTED_DEPARTMENT/g" ${ARGOCD_K8S_FILE_NAME}.j2.tmp
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_K8S_FILE_NAME}.j2.tmp
    sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${ARGOCD_K8S_FILE_NAME}.j2.tmp
    sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${ARGOCD_K8S_FILE_NAME}.j2.tmp
    sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${ARGOCD_K8S_FILE_NAME}.j2.tmp
    sed -i "s/@ROLLME_VALUE/$(date +%s%N | sha256sum | cut -c1-5)/g" ${ARGOCD_K8S_FILE_NAME}.j2.tmp

    cp ${ARGOCD_K8S_FILE_NAME}.j2.tmp ${ARGOCD_K8S_FILE_NAME}.j2.preview
    sed -i "s/@SP_CONTENT//g" ${ARGOCD_K8S_FILE_NAME}.j2.preview
    sed -i "s/@CONFIG_CONTENT//g" ${ARGOCD_K8S_FILE_NAME}.j2.preview
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2.preview -o ./${ARGOCD_K8S_FILE_NAME}.preview
    cat $ARGOCD_K8S_FILE_NAME.preview

    replace_file_content "@SP_CONTENT" "$SP_FILE_NAME" "$SP_FILE_PATH/$SP_FILE" "${ARGOCD_K8S_FILE_NAME}.j2.tmp"
    replace_file_content "@CONFIG_CONTENT" "$CONFIG_FILE_NAME" "$CONFIG_FILE_PATH/$CONFIG_FILE" "${ARGOCD_K8S_FILE_NAME}.j2.tmp"
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2.tmp -o ./${ARGOCD_K8S_FILE_NAME}

.create_argocd_repo: &create_argocd_repo
  - |
    create_argocd_repo "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME"
    create_argocd_repo "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME"

.clone_argocd_repo: &clone_argocd_repo
  - |
    clone_argocd_repo "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME"
    clone_argocd_repo "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME"

.copy_template_file: &copy_template_file
  - |
    copy_file "applications" "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_TEMPLATE_FILE_NAME" "${FORMATTED_ENV_NAME}.yaml"
    copy_file "applications" "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME" "$ARGOCD_APP_TEMPLATE_FILE_NAME" "${ENV_VERSION_NAME}.yaml"

.copy_values_file: &copy_values_file
  - |
    copy_file "charts" "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_FILE_NAME" "values-${FORMATTED_ENV_NAME}.yaml"
    copy_file "charts" "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME" "$ARGOCD_K8S_FILE_NAME" "values-${ENV_VERSION_NAME}.yaml"

.copy_chart_file: &copy_chart_file
  - |
    copy_file "charts" "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_CHART_FILE_NAME" "Chart.yaml"
    copy_file "charts" "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME" "$ARGOCD_APP_CHART_FILE_NAME" "Chart.yaml"

.push_to_argocd_repo: &push_to_argocd_repo
  - |
    push_to_argocd_repo "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "$FORMATTED_ENV_NAME" "$TRIGGER_BY"
    push_to_argocd_repo "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME" "$ENV_VERSION_NAME" "$TRIGGER_BY"

.create_argocd_app: &create_argocd_app
  - |
    create_argocd_app "$FORMATTED_STACK_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME" "$FORMATTED_ENV_NAME" "$ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_TEMPLATE_FILE_NAME"
    create_argocd_app "$FORMATTED_STACK_NAME" "$FORMATTED_APP_NAME" "$ENV_VERSION_NAME" "$ARGOCD_APP_TEMPLATE_FILE_NAME"

.sync_argocd_app: &sync_argocd_app
  - |
    sync_argocd_app "${FORMATTED_STACK_NAME}" "${ARGOCD_NAMESPACE_IMAGE_PULL_SECRETS_APP_NAME}" "${FORMATTED_ENV_NAME}"
    sync_argocd_app "${FORMATTED_STACK_NAME}" "${FORMATTED_APP_NAME}" "${ENV_VERSION_NAME}" "true"

.process_sync_argocd_application: &process_sync_argocd_application
  - *create_argocd_repo
  - *clone_argocd_repo
  - *copy_template_file
  - *copy_chart_file
  - *copy_values_file
  - *push_to_argocd_repo
  - *create_argocd_app
  - *sync_argocd_app

# region: Shared configmaps
.prepare_shared_configmaps_helpers: &prepare_shared_configmaps_helpers
  - *prepare_helpers
  - *add_file_to_group_helper
  - *group_versions_helper
  - *group_files_helper

.fetch_shared_configmaps_changed_files: &fetch_shared_configmaps_changed_files
  - |
    echo "Fetching changed config files..."

    if [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$CI_COMMIT_BEFORE_SHA" 2>/dev/null; then
      CI_COMMIT_BEFORE_SHA=HEAD~1
    fi

    CHANGED_FILES=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA")
    echo "$CHANGED_FILES"

    DELETED_FILES=$(git diff --name-only --diff-filter=D "$CI_COMMIT_BEFORE_SHA")

.group_shared_configmaps_files: &group_shared_configmaps_files
  - |
    echo "Grouping versions..."
    GROUPED_VERSIONS_DATA=$(group_versions "$CHANGED_FILES")
    echo "$GROUPED_VERSIONS_DATA" | jq -c '.[] | {key: .key, versions: [.versions[]]}'
  - |
    echo "Grouping files..."
    GROUPED_FILES_DATA=$(group_files "$DELETED_FILES" "$GROUPED_VERSIONS_DATA")
    echo "$GROUPED_FILES_DATA" | jq -c '.[] | {key: .key, files: [.files[] | .name]}'

.generate_argocd_shared_configmaps_template_file: &generate_argocd_shared_configmaps_template_file
  - |
    download_file "$ARGOCD_APP_TEMPLATE_FILE_PATH" "${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2"
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')
      cluster=$(echo "$group" | jq -r '.cluster')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type
      output_file=$stack-$app_name-$version-app-template.yaml

      generate_argocd_template "$stack" "$app_name" "$version" "$cluster" "$output_file"
    done

.generate_argocd_shared_configmaps_chart_file: &generate_argocd_shared_configmaps_chart_file
  - |
    download_file "$ARGOCD_APP_CHART_FILE_PATH" "${ARGOCD_APP_CHART_FILE_NAME}.j2"
    echo "$GROUPED_VERSIONS_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type
      output_file=$stack-$app_name-app-chart.yaml

      generate_argocd_chart "$app_name" "$SHARED_CONFIGMAPS_CHART_NAME" "$SHARED_CONFIGMAPS_CHART_VERSION" "$output_file"
    done

.generate_argocd_shared_configmaps_values_file: &generate_argocd_shared_configmaps_values_file
  - |
    download_file "$ARGOCD_SHARED_CONFIGMAPS_FILE_PATH" "${ARGOCD_SHARED_CONFIGMAPS_FILE_NAME}.j2"
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')
      files_json=$(echo "$group" | jq -c '{
        files: [
          .files[] | {
            name: .name,
            content: .content
          }
        ]
      }')
      echo "$files_json" > FILES_DATA.json

      output_file=$stack-$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type-$version-values.yaml

      echo "Generating $output_file...";
      cp ${ARGOCD_SHARED_CONFIGMAPS_FILE_NAME}.j2 ${output_file}.j2.tmp

      jinja render -d ./FILES_DATA.json -t ./${output_file}.j2.tmp -o ./${output_file}
    done

.create_argocd_shared_configmaps_repo: &create_argocd_shared_configmaps_repo
  - |
    echo "$GROUPED_VERSIONS_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type

      create_argocd_repo "$stack" "$app_name"
    done

.clone_argocd_shared_configmaps_repo: &clone_argocd_shared_configmaps_repo
  - |
    echo "$GROUPED_VERSIONS_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')

      ARGOCD_SHARED_CONFIGMAPS_APP_NAME_TMP=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type

      clone_argocd_repo "$stack" "$ARGOCD_SHARED_CONFIGMAPS_APP_NAME_TMP"
    done

.copy_shared_configmaps_template_file: &copy_shared_configmaps_template_file
  - |
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type
      output_file=$stack-$app_name-$version-app-template.yaml

      copy_file "applications" "$stack" "$app_name" "$output_file" "${version}.yaml"
    done

.copy_shared_configmaps_values_file: &copy_shared_configmaps_values_file
  - |
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type
      output_file=$stack-$app_name-$version-values.yaml

      copy_file "charts" "$stack" "$app_name" "$output_file" "values-${version}.yaml"
    done

.copy_shared_configmaps_chart_file: &copy_shared_configmaps_chart_file
  - |
    echo "$GROUPED_VERSIONS_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type
      output_file=$stack-$app_name-app-chart.yaml

      copy_file "charts" "$stack" "$app_name" "$output_file" "Chart.yaml"
    done

.push_to_argocd_shared_configmaps_repo: &push_to_argocd_shared_configmaps_repo
  - |
    echo "$GROUPED_VERSIONS_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      versions=$(echo "$group" | jq -r '.versions[]' | tr '\n' '-' | sed 's/-$//')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type

      push_to_argocd_repo "$stack" "$app_name" "$versions" "$CI_COMMIT_AUTHOR"
    done

.create_argocd_shared_configmaps_app: &create_argocd_shared_configmaps_app
  - |
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type
      output_file=$stack-$app_name-$version-app-template.yaml

      create_argocd_app "$stack" "$app_name" "$version" "$output_file"
    done

.sync_argocd_shared_configmaps_app: &sync_argocd_shared_configmaps_app
  - |
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')

      app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type

      sync_argocd_app "$stack" "$app_name" "$version" "true"
    done

.delete_argocd_shared_configmaps_app: &delete_argocd_shared_configmaps_app
  - |
    echo "$GROUPED_FILES_DATA" | jq -c '.[]' | while read -r group; do
      stack=$(echo "$group" | jq -r '.stack')
      type=$(echo "$group" | jq -r '.type')
      version=$(echo "$group" | jq -r '.version')

      is_all_files_empty=$(echo "$group" | jq '[.files[] | .content == ""] | all')

      if [ "$is_all_files_empty" == "true" ]; then
        app_name=$ARGOCD_SHARED_CONFIGMAPS_APP_NAME-$type

        delete_argocd_app "$stack" "$app_name" "$version"
      fi
    done
# endregion
# endregion

# region: Job templates
.prepare_argocd_app_file:
  script:
    - echo "===== PREPARING ARGOCD APP FILE ... ====="
    - echo "$VARS_DATA" > VARS_DATA.json
    - *prepare_variables
    - *prepare_helpers
    - *generate_argocd_template_file
    - *generate_argocd_chart_file
    - *generate_argocd_values_file

.prepare_argocd_values_file:
  script:
    - echo "===== PREPARING ARGOCD VALUES FILE ... ====="
    - echo "$VARS_DATA" > VARS_DATA.json
    - *prepare_variables
    - *prepare_helpers
    - *declare_argocd_repo_exist_var
    - *generate_argocd_template_file
    - *generate_argocd_chart_file
    - *generate_argocd_values_file

.prepare_argocd_shared_configmaps_values_file:
  script:
    - echo "===== PREPARING ARGOCD SHARED CONFIGMAPS VALUES FILE ... ====="
    - *prepare_variables
    - *prepare_shared_configmaps_helpers
    - *fetch_shared_configmaps_changed_files
    - *group_shared_configmaps_files
    - *generate_argocd_shared_configmaps_chart_file
    - *generate_argocd_shared_configmaps_template_file
    - *generate_argocd_shared_configmaps_values_file

.deploy_argocd_application:
  script:
    - echo "===== DEPLOY ARGOCD APPLICATION ... ====="
    - ACTION_TYPE=deploy
    - *create_argocd_repo
    - *clone_argocd_repo
    - *copy_template_file
    - *copy_chart_file
    - *copy_values_file
    - *push_to_argocd_repo
    - *create_argocd_app
    - *sync_argocd_app

.update_k8s_ingress_argocd:
  script:
    - echo "===== UPDATE INGRESS ARGOCD APPLICATION ... ====="
    - ACTION_TYPE=update-ingress
    - *process_sync_argocd_application

.sync_argocd_application:
  script:
    - echo "===== SYNC ARGOCD APPLICATION ... ====="
    - ACTION_TYPE=sync-argo-app
    - *process_sync_argocd_application

.sync_argocd_shared_configmaps_application:
  script:
    - echo "===== SYNC ARGOCD SHARED CONFIGMAPS APPLICATION ... ====="
    - ACTION_TYPE=sync-argo-app
    - *create_argocd_shared_configmaps_repo
    - *clone_argocd_shared_configmaps_repo
    - *copy_shared_configmaps_template_file
    - *copy_shared_configmaps_values_file
    - *copy_shared_configmaps_chart_file
    - *push_to_argocd_shared_configmaps_repo
    - *create_argocd_shared_configmaps_app
    - *sync_argocd_shared_configmaps_app
    - *delete_argocd_shared_configmaps_app
# endregion
