variables:
  # DefectDojo Configuration
  DEFECTDOJO_PRODUCT_NAME: "${CI_PROJECT_NAME}-${DEFECTDOJO_DEPT}"
  DEFECTDOJO_DEPT: "Atomix"
  ENGAGEMENT_NAME: $APP_URL
  DEFECTDOJO_SCAN_FILE: "zap-report.xml"
  DEFECTDOJO_SCAN_TYPE: "ZAP Scan"
  DEFECTDOJO_SCAN_TEST_TYPE: "ZAP Scan"
  DEFECTDOJO_TEST_TITLE: "ZAP DAST Scan - $APP_URL"
  DEFECTDOJO_SCAN_ACTIVE: true
  DEFECTDOJO_SCAN_VERIFIED: true
  DEFECTDOJO_SCAN_MINIMUM_SEVERITY: "Low"
  DEFECTDOJO_AUTO_CREATE_CONTEXT: true
  DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT: true
  DEFECTDOJO_ENGAGEMENT_THREAT_MODEL: false
  DEFECTDOJO_ENGAGEMENT_API_TEST: false
  DEFECTDOJO_ENGAGEMENT_PEN_TEST: false
  DEFECTDOJO_ENGAGEMENT_CHECK_LIST: false
  DEFECTDOJO_ENGAGEMENT_PERIOD: 90
  DEFECTDOJO_ENGAGEMENT_STATUS: "In Progress"
  DEFECTDOJO_SCAN_CLOSE_OLD_FINDINGS: false
  DEFECTDOJO_CLOSE_OLD_FINDINGS_PRODUCT_SCOPE: false
  DEFECTDOJO_ENGAGEMENT_SOURCE_CODE_MANAGEMENT_SERVER: "GitLab"
  # ZAP Variables
  APP_URL: "http://sample-test.nexdev.net"
  ZAP_SCAN_ENABLED: true
  ZAP_FULL_SCAN_ENABLED: true
  HEALTH_CHECK_RETRIES: 5
  HEALTH_CHECK_DELAY: 5