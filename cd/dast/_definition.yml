.zap_scan:
  variables:
  #   DEFECTDOJO_ENGAGEMENT_BUILD_SERVER: null
  #   DEFECTDOJO_ENGAGEMENT_ORCHESTRATION_ENGINE: null
  #   DEFECTDOJO_SCAN_ACTIVE: true
  #   DEFECTDOJO_SCAN_VERIFIED: true
  #   DEFECTDOJO_SCAN_MINIMUM_SEVERITY: "Critical"
  #   DEFECTDOJO_AUTO_CREATE_CONTEXT: true
  #   DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT: false
  #   DEFECTDOJO_ENGAGEMENT_THREAT_MODEL: true
  #   DEFECTDOJO_ENGAGEMENT_API_TEST: true
  #   DEFECTDOJO_ENGAGEMENT_PEN_TEST: true
  #   DEFECTDOJO_ENGAGEMENT_CHECK_LIST: true
  #   DEFECTDOJO_ENGAGEMENT_STATUS: "In Progress"
  #   DEFECTDOJO_SCAN_CLOSE_OLD_FINDINGS: true
  #   DEFECTDOJO_CLOSE_OLD_FINDINGS_PRODUCT_SCOPE: false
  #   DEFECTDOJO_ENGAGEMENT_SOURCE_CODE_MANAGEMENT_SERVER: null  
  #   DEFECTDOJO_NOT_ON_MASTER: false 
  #   DEFECTDOJO_PRODUCT_NAME: "${CI_PROJECT_NAME}-${DEFECTDOJO_DEPT}"
  #   DEFECTDOJO_DEPT: $DEPARTMENT
  #   DEFECTDOJO_ENGAGEMENT_NAME: $ENV_NAME
  #   DEFECTDOJO_SCAN_ENVIRONMENT: $ENV_NAME
  #   DEFECTDOJO_ENGAGEMENT_PERIOD: 180
    DEFECTDOJO_SCAN_TEST_TYPE: "ZAP Scan"
    DEFECTDOJO_SCAN_FILE: "zap-report.xml"
    DEFECTDOJO_SCAN_TYPE: "ZAP Scan"
  stage: dast
  image: $DOCKER_REG_LOCAL_URL/docker-hub/zaproxy/zap-stable:2.16.1
  before_script:
    - echo "Starting ZAP scan preparation"
    - echo "Target URL - $APP_URL"
    - echo "Full scan enabled - $ZAP_FULL_SCAN_ENABLED"  
  script:
    - echo "Checking if the target is reachable..."
    - mkdir -p /zap/wrk
    - ln -s "$CI_PROJECT_DIR" /zap/wrk
    # Extract site_url for DefectDojo upload
    - |
      if [ -n "$APP_URL" ]; then
        site_url=$(echo "$APP_URL" | sed -E 's|^https?://||' | sed 's|/.*||')
        export site_url
        echo "✅ Extracted site_url: $site_url"
      else
        echo "⚠️ APP_URL not set, using default"
        site_url="localhost"
        export site_url
      fi
    - |
      cat > /zap/wrk/zap-config.conf << EOF
      # ZAP Baseline Configuration
      # Ignore Info level findings
      # 10015	IGNORE	(Incomplete or No Cache-control and Pragma HTTP Header Set)
      # 10027	IGNORE	(Information Disclosure - Suspicious Comments)
      # 10109	IGNORE	(Modern Web Application)
      EOF
    - |
      if [ "$ZAP_FULL_SCAN_ENABLED" = "true" ]; then
        echo "Starting ZAP FULL scan..."
        zap-full-scan.py -t "https://m-sample1.nexdev.net" -x zap-report.xml -I -c /zap/wrk/zap-config.conf
      else
        echo "Starting ZAP baseline scan..."
        zap-baseline.py -t "https://m-sample1.nexdev.net" -x zap-report.xml -I -c /zap/wrk/zap-config.conf
      fi
    - cp /zap/wrk/zap-report.xml "$CI_PROJECT_DIR/" || true
    - !reference [.defectdojo_upload, script]
  tags:
    - docker