.publish_npm:
  stage: publish
  image: $PUBLISH_NPM_IMAGE
  before_script:
    - |
      apt-get update
      apt-get upgrade -y
      apt-get install -y git
  script:
    - npm install -g npm-cli-login
    - npm-cli-login -u $NPM_LUMI_USER_NAME -p $NPM_LUMI_USER_PASSWORD -e $NPM_LUMI_USER_EMAIL -r $NPM_LOCAL_HOST
    - npm set registry $NPM_LOCAL_HOST
    - yarn install
    - npm run reg
    - if [ "$NPM_LANG_TS" == "true" ]; then
        npm run build;
      fi;
    - npx semantic-release
  tags:
    - docker