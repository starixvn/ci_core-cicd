.login-registry:
  script:
    - echo "$REGISTRY_IMAGE"
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F registryUrl=$REGISTRY_IMAGE $DEPLOYMENT_API/loginRegistry?token=$DEPLOY_API_TOKEN

.generate-and-sync-docker-compose:
  script:
    - echo "$DEPLOYMENT_API - $SERVER_USER"
    - echo "===== GENERATE docker-compose.yml ... =====";
    - echo $VARS_DATA > VARS_DATA.json
    - curl --fail -o ${DOCKER_COMPOSE_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$DOCKER_COMPOSE_FILE_PATH/raw?ref=$DOCKER_COMPOSE_REF
    - sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${DOCKER_COMPOSE_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${DOCKER_COMPOSE_FILE_NAME}.j2 -o ./${DOCKER_COMPOSE_FILE_NAME}
    - sed -i "s/@CONFIG_VERSION/$(date +%s)/g" $DOCKER_COMPOSE_FILE_NAME
    - sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" $DOCKER_COMPOSE_FILE_NAME
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" $DOCKER_COMPOSE_FILE_NAME
    - sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" $DOCKER_COMPOSE_FILE_NAME
    - cat $DOCKER_COMPOSE_FILE_NAME
    - echo "===== SYNC docker-compose.yml ... ====="
    - echo "Remote path --> $WORKING_PATH/$DEPLOY_ENV/docker-compose.yml"    
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F remotePath="$WORKING_PATH/$DEPLOY_ENV/docker-compose.yml" -F file=@"$DOCKER_COMPOSE_FILE_NAME" $DEPLOYMENT_API/scp?token=$DEPLOY_API_TOKEN

.sync-config:
  script:
    - echo $CONFIG_FILE_PATH/$CONFIG_FILE
    - ls -l $CONFIG_FILE_PATH
    - echo $TRANSFORM_CONFIG
    - if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        echo "===== SYNC $CONFIG_FILE ... =====";
        curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F remotePath="$WORKING_PATH/$DEPLOY_ENV/configs/$CONFIG_DEST_FILE" -F file=@"$CONFIG_FILE_PATH/$CONFIG_FILE" $DEPLOYMENT_API/scp?token=$DEPLOY_API_TOKEN;      
      fi

.remove-old-swarm-configs:
  script:
    - echo "===== REMOVING OLD CONFIGS ... =====";   
    - if [ ! -z "$CONFIG_FILE_NAME" ];
      then 
        curl -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F configName=${SERVICE_NAME}_${DEPLOY_ENV}_config $DEPLOYMENT_API/removeSwarmConfigs?token=$DEPLOY_API_TOKEN;        
      fi

.deploy-swarm-service:
  script:
    - echo "===== DEPLOYING SERVICE ... =====";
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F workingDirectory=$WORKING_PATH -F stack=$STACK_NAME $DEPLOYMENT_API/deploySwarmService?token=$DEPLOY_API_TOKEN;   

.prepare_k8s_deployments_values:
  script:
    - echo "===== GENERATE k8sdeployments-values.yaml ... =====";
    - echo $VARS_DATA > VARS_DATA.json
    - curl --fail -o ${K8S_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$K8S_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${K8S_FILE_NAME}.j2
    - sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${K8S_FILE_NAME}.j2
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${K8S_FILE_NAME}.j2
    - sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${K8S_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${K8S_FILE_NAME}.j2 -o ./${K8S_FILE_NAME}
    - cat $K8S_FILE_NAME
    - echo "===== SYNC k8sdeployments-values.yaml ... ====="
    - echo "Remote path --> $WORKING_PATH/$DEPLOY_ENV/$K8S_FILE_NAME"    
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F remotePath="$WORKING_PATH/$DEPLOY_ENV/$K8S_FILE_NAME" -F file=@"$K8S_FILE_NAME" $DEPLOYMENT_API/scp?token=$DEPLOY_API_TOKEN

.deploy_k8s:
  script:
    - echo "===== DEPLOYING K8S RESOURCES ... =====";
    - |
      RELEASE_NAME=${SERVICE_NAME}_${DEPLOY_ENV/_/}
      echo $RELEASE_NAME
      CHART_BASE_URL=oci://${REGISTRY_IMAGE}/charts
      echo $CHART_BASE_URL
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        CONFIG_DEST_FILE_NAME=configs/$CONFIG_DEST_FILE
      fi
      echo $CONFIG_DEST_FILE_NAME
      if [ ! -z "$SP_FILE_NAME" ];
      then
        SP_DEST_FILE_NAME=configs/$SP_FILE_NAME.$SP_FILE_EXTENSION
      fi
      echo $SP_DEST_FILE_NAME
    - curl --retry-max-time 60 --retry 1 --fail --no-progress-meter -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F workingDirectory=$WORKING_PATH -F releaseName=$RELEASE_NAME -F chartBaseUrl=$CHART_BASE_URL -F chartVersion=1.3.1 -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F configFileName=$CONFIG_DEST_FILE_NAME -F spFileName=$SP_DEST_FILE_NAME -F namespace=$STACK_NAME $DEPLOYMENT_API/deployKubernetes?token=$DEPLOY_API_TOKEN;

.update_k8s_ingress:
  script:
    - echo "===== UPDATING K8S INGRESS ... =====";
    - |
      RELEASE_NAME=${SERVICE_NAME}_${DEPLOY_ENV/_/}
      echo $RELEASE_NAME
      CHART_BASE_URL=oci://${REGISTRY_IMAGE}/charts
      echo $CHART_BASE_URL
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        CONFIG_DEST_FILE_NAME=configs/$CONFIG_DEST_FILE
      fi
      echo $CONFIG_DEST_FILE_NAME
      if [ ! -z "$SP_FILE_NAME" ];
      then
        SP_DEST_FILE_NAME=configs/$SP_FILE_NAME.$SP_FILE_EXTENSION
      fi
      echo $SP_DEST_FILE_NAME
    - curl --retry-max-time 60 --retry 1 --fail --no-progress-meter -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F workingDirectory=$WORKING_PATH -F releaseName=$RELEASE_NAME -F chartBaseUrl=$CHART_BASE_URL -F chartVersion=1.3.1 -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F configFileName=$CONFIG_DEST_FILE_NAME -F spFileName=$SP_DEST_FILE_NAME -F namespace=$STACK_NAME -F enableIngress=$ENABLE_INGRESS $DEPLOYMENT_API/updateIngress?token=$DEPLOY_API_TOKEN;

# === ARGOCD ===
.generate_template_helper: &generate_template_helper
  - |
    generate_argocd_template() {
      local type="$1"
      local app_name="$2"
      local env_name="$3"
      local src_path="$4"
      local output_file="$5"

      echo "Generating $ARGOCD_APP_TEMPLATE_FILE_NAME for $type...";
      curl --fail -o ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_TEMPLATE_FILE_PATH/raw?ref=$ARGOCD_REF
      sed -i "s/@APP_NAME/$app_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@STACK_NAME/$STACK_NAME/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@ENV_NAME/$env_name/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@DEST_NAME/$ARGO_CLUSTER/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s|@SRC_PATH|$src_path|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s|@SRC_REPO_URL|$ARGOCD_REPO_URL|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      sed -i "s/@SRC_TARGET_REVISION/$ARGOCD_TARGET_REVISION/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 -o ./${output_file}
    }

.generate-argocd-template-file: &generate-argocd-template-file
  - ENV_VERSION_NAME=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
  - *generate_template_helper
  - |
    generate_argocd_template "secret" "$IMAGE_PULL_SECRETS_CHART_NAME" "${ENV_VERSION_NAME//[0-9]/}" "$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME" "$ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME"
    generate_argocd_template "application" "$APP_NAME" "${ENV_VERSION_NAME}" "$APPLICATION_PATH" "$ARGOCD_APP_TEMPLATE_FILE_NAME"

.generate_chart_helper: &generate_chart_helper
  - |
    generate_argocd_chart() {
      local type="$1"
      local app_name="$2"
      local dep_name="$3"
      local dep_version="$4"
      local output_file="$5"

      echo "Generating $ARGOCD_APP_CHART_FILE_NAME for $type...";
      curl --fail -o ${ARGOCD_APP_CHART_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_CHART_FILE_PATH/raw?ref=$ARGOCD_REF
      sed -i "s/@APP_NAME/$app_name/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      sed -i "s/@DEP_NAME/$dep_name/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      sed -i "s/@DEP_VERSION/$dep_version/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2 -o ./${output_file}
    }

.generate-argocd-chart-file: &generate-argocd-chart-file
  - *generate_chart_helper
  - |
    generate_argocd_chart "secret" "$IMAGE_PULL_SECRETS_CHART_NAME" "$IMAGE_PULL_SECRETS_CHART_NAME" "$IMAGE_PULL_SECRETS_CHART_VERSION" "$ARGOCD_SECRET_APP_CHART_FILE_NAME"
    generate_argocd_chart "application" "$APP_NAME" "$K8S_DEPLOYMENTS_CHART_NAME" "$K8S_DEPLOYMENTS_CHART_VERSION" "$ARGOCD_APP_CHART_FILE_NAME"

.generate-argocd-values-file: &generate-argocd-values-file
  - |
    echo "Generating $ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME...";
    curl --fail -o ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_IMAGE_PULL_SECRETS_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    sed -i "s/@REGISTRY_USERNAME/$DOCKER_REG_LOCAL_USERNAME/g" ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    sed -i "s/@REGISTRY_PASSWORD/$DOCKER_REG_LOCAL_PASSWORD/g" ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2 -o ./${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}
  - |
    echo "Generating $ARGOCD_K8S_FILE_NAME...";
    curl --fail -o ${ARGOCD_K8S_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_K8S_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${ARGOCD_K8S_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME}.preview
    cat $ARGOCD_K8S_FILE_NAME.preview
    if [ ! -z "$SP_FILE_NAME" ];
    then
      awk -v sp_content="$(< "$SP_FILE_PATH/$SP_FILE")" '{gsub(/@SP_CONTENT/, sp_content); print}' "${ARGOCD_K8S_FILE_NAME}.j2" > "${ARGOCD_K8S_FILE_NAME}.j2.tmp" && mv "${ARGOCD_K8S_FILE_NAME}.j2.tmp" "${ARGOCD_K8S_FILE_NAME}.j2"
    fi
    if [ ! -z "$CONFIG_FILE_NAME" ];
    then
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME} -e "config_content='$(< "$CONFIG_FILE_PATH/$CONFIG_FILE")'"
    else
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME}
    fi

.prepare_argocd_app_file:
  script:
    - echo "===== PREPARING ARGOCD APP FILE ... ====="
    - echo $VARS_DATA > VARS_DATA.json
    - *generate-argocd-template-file
    - *generate-argocd-chart-file
    - *generate-argocd-values-file

.prepare_argocd_values_file:
  script:
    - echo "===== PREPARING ARGOCD VALUES FILE ... ====="
    - echo $VARS_DATA > VARS_DATA.json
    - *generate-argocd-values-file

.clone_argocd_repo: &clone_argocd_repo
  - |
    echo "Cloning ArgoCD repository..."
    ARGOCD_REPO_HOST=$(echo $ARGOCD_REPO_URL | sed 's|https://||')
    git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${ARGOCD_REPO_HOST} $ARGOCD_ROOT_FOLDER
    cd $ARGOCD_ROOT_FOLDER
    echo "Switching to branch: $ARGOCD_TARGET_REVISION..."
    git switch $ARGOCD_TARGET_REVISION

.copy_file_helper: &copy_file_helper
  - |
    copy_file() {
      local source_file="$1"
      local dest_path="$2"
      local dest_dir=$(dirname "$dest_path")

      if [ ! -d "$dest_dir" ];
      then
        echo "Creating folder: $dest_dir"
        mkdir -p "$dest_dir"
      fi
      echo "Copying $source_file to $dest_path..."
      cp "../$source_file" "$dest_path"
    }

.copy_template_file: &copy_template_file
  - |
    copy_file "$ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME" "applications/templates/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/${ENV_VERSION_NAME//[0-9]/}.yaml"
    copy_file "$ARGOCD_APP_TEMPLATE_FILE_NAME" "applications/templates/$APPLICATION_PATH/${ENV_VERSION_NAME}.yaml"

.copy_values_file: &copy_values_file
  - |
    copy_file "$ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME" "charts/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/values-${ENV_VERSION_NAME//[0-9]/}.yaml"
    copy_file "$ARGOCD_K8S_FILE_NAME" "charts/$APPLICATION_PATH/values-${ENV_VERSION_NAME}.yaml"

.copy_chart_file: &copy_chart_file
  - |
    copy_file "$ARGOCD_SECRET_APP_CHART_FILE_NAME" "charts/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/Chart.yaml"
    copy_file "$ARGOCD_APP_CHART_FILE_NAME" "charts/$APPLICATION_PATH/Chart.yaml"

.push_to_argocd_repo: &push_to_argocd_repo
  - |
    if [ -n "$(git status --porcelain)" ];
    then
      echo "Pushing to ArgoCD repository..."
      git config user.email $ROCKETOR_GIT_EMAIL
      git config user.name $ROCKETOR_GIT_USER
      git add -A
      git commit -m "[${ACTION_NAME}-${STACK_NAME}-${APP_NAME}-${ENV_VERSION_NAME}] $CI_COMMIT_MESSAGE"

      MAX_RETRIES=3
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ];
      do
        echo "Pulling latest changes from remote repository..."
        git pull origin $ARGOCD_TARGET_REVISION --rebase
        echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES to push changes..."
        if git push origin $ARGOCD_TARGET_REVISION;
        then
          break
        else
          RETRY_COUNT=$((RETRY_COUNT + 1))
          if [ $RETRY_COUNT -lt $MAX_RETRIES ];
          then
            SLEEP_TIME=$((RANDOM % 5 + 1))
            echo "Waiting $SLEEP_TIME seconds before retrying..."
            sleep $SLEEP_TIME
          fi
        fi
      done
    else
      echo "No changes detected. Skipping commit and push."
    fi

.sync_argocd_app_helper: &sync_argocd_app_helper
  - |
    sync_argocd_app() {
      local app_name="$1"
      local template_file="$2"

      if [ $ACTION_NAME == "deploy" ];
      then
        echo "Creating $app_name if not exists..."
        argocd app create -f "../$template_file" --upsert --grpc-web
      fi
      if ! argocd app diff "$app_name" --refresh --grpc-web --exit-code;
      then
        echo "Changes detected. Triggering sync $app_name..."
        argocd app sync "$app_name" --prune --replace --grpc-web
      else
        echo "No manifest changes. Skipping sync for $app_name."
      fi
      echo "Waiting for $app_name healthy status..."
      argocd app wait "$app_name" --health --timeout $ARGOCD_SYNC_TIMEOUT --grpc-web
    }

.sync_argocd_app: &sync_argocd_app
  - |
    echo "Logging into Argo CD..."
    argocd login $ARGOCD_HOST --username $ARGOCD_USERNAME --password $ARGOCD_PASSWORD --insecure --grpc-web
  - *sync_argocd_app_helper
  - |
    sync_argocd_app "${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_VERSION_NAME//[0-9]/}" "$ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME"
    sync_argocd_app "${STACK_NAME}-${APP_NAME}-${ENV_VERSION_NAME}" "$ARGOCD_APP_TEMPLATE_FILE_NAME"

.deploy_argocd_application:
  script:
    - echo "===== DEPLOY ARGOCD APPLICATION ... ====="
    - *clone_argocd_repo
    - ENV_VERSION_NAME=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    - *copy_file_helper
    - *copy_template_file
    - *copy_chart_file
    - *copy_values_file
    - ACTION_NAME=deploy
    - *push_to_argocd_repo
    - *sync_argocd_app

.update_ingress_argocd_application:
  script:
    - echo "===== UPDATE INGRESS ARGOCD APPLICATION ... ====="
    - *clone_argocd_repo
    - ENV_VERSION_NAME=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    - *copy_file_helper
    - *copy_values_file
    - ACTION_NAME=update-ingress
    - *push_to_argocd_repo
    - *sync_argocd_app
