variables:
  SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
  GIT_DEPTH: 0 # Tells git to fetch all the branches of the project, required by the analysis task
  SONAR_SCANNER_CLI_IMAGE: $DOCKER_REG_LOCAL_URL/base/sonarsource/sonar-scanner-cli:11.4
  SONAR_SCANNER_DOTNET_IMAGE: $DOCKER_REG_LOCAL_URL/base/dotnet/core/sdk:5-6-7-8-9-java17jre-utf8