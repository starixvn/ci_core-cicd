include:
  - cd/dast/_definition.yml
  - cd/dast/_vars.yml

dast:
  extends:
    - .zap_scan
  rules:
    - when: on_success
# Test job to verify configuration
test_dast:
  stage: dast
  image: $DOCKER_REG_LOCAL_URL/docker-hub/zaproxy/zap-stable:2.16.1
  before_script:
    - echo "Testing DAST configuration..."
  script:
    - echo "Job name - $CI_JOB_NAME"
    - echo "Stage - $CI_JOB_STAGE"
    - echo "Host - $host"
    - echo "APP_URL - $APP_URL"
    - echo "ZAP_FULL_SCAN_ENABLED - $ZAP_FULL_SCAN_ENABLED"
    - echo "DOCKER_REG_LOCAL_URL - $DOCKER_REG_LOCAL_URL"
    - echo "DEFECTDOJO_URL - $DEFECTDOJO_URL"
    - echo "ZAP version check"
    - zap-baseline.py --version || echo "ZAP baseline script not found"
  rules:
    - when: manual
  rules:
    - when: on_success