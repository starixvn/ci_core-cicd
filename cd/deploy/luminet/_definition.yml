include:
  - cd/deploy/_shared/_base.yml

.base_deploy_stack_swarm:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.login-registry, script]
    - !reference [.generate-and-sync-docker-compose, script]
    - !reference [.sync-config, script]
    - !reference [.remove-old-swarm-configs, script]
    - !reference [.deploy-swarm-service, script]
  tags:
    - docker

.base_deploy_k8s:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_k8s_deployments_values, script]
    - !reference [.sync-config, script]
    - !reference [.deploy_k8s, script]
  tags:
    - docker

.base_update_k8s_ingress:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_k8s_deployments_values, script]
    - !reference [.update_k8s_ingress, script]
  tags:
    - docker