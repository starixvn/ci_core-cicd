    sed -i "s/@DEP_NAME/$IMAGE_PULL_SECRETS_CHART_NAME/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    sed -i "s/@DEP_VERSION/$IMAGE_PULL_SECRETS_CHART_VERSION/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2 -o ./${ARGOCD_SECRET_APP_CHART_FILE_NAME}
  - |
    echo "===== GENERATE $ARGOCD_APP_CHART_FILE_NAME for application ... =====";
    curl --fail -o ${ARGOCD_APP_CHART_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_CHART_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s/@APP_NAME/$APP_NAME/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    sed -i "s/@DEP_NAME/$K8S_DEPLOYMENTS_CHART_NAME/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    sed -i "s/@DEP_VERSION/$K8S_DEPLOYMENTS_CHART_VERSION/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2 -o ./${ARGOCD_APP_CHART_FILE_NAME}

.generate-argocd-values-files: &generate-argocd-values-files
  - |
    echo "===== GENERATE $ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME ... =====";
    curl --fail -o ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_IMAGE_PULL_SECRETS_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    sed -i "s/@REGISTRY_USERNAME/$DOCKER_REG_LOCAL_USERNAME/g" ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    sed -i "s/@REGISTRY_PASSWORD/$DOCKER_REG_LOCAL_PASSWORD/g" ${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}.j2 -o ./${ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME}
  - |
    echo "===== GENERATE $ARGOCD_K8S_FILE_NAME ... =====";
    curl --fail -o ${ARGOCD_K8S_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_K8S_FILE_PATH/raw?ref=$ARGOCD_REF
    sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${ARGOCD_K8S_FILE_NAME}.j2
    sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${ARGOCD_K8S_FILE_NAME}.j2
    jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME}.preview
    cat $ARGOCD_K8S_FILE_NAME.preview
    if [ ! -z "$SP_FILE_NAME" ];
    then
      awk -v sp_content="$(< "$SP_FILE_PATH/$SP_FILE")" \
        '{gsub(/@SP_CONTENT/, sp_content); print}' \
        "${ARGOCD_K8S_FILE_NAME}.j2" > "${ARGOCD_K8S_FILE_NAME}.j2.tmp" \
        && mv "${ARGOCD_K8S_FILE_NAME}.j2.tmp" "${ARGOCD_K8S_FILE_NAME}.j2"
    fi
    if [ ! -z "$CONFIG_FILE_NAME" ];
    then
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME} -e "config_content='$(< "$CONFIG_FILE_PATH/$CONFIG_FILE")'"
    else
      jinja render -d ./VARS_DATA.json -t ./${ARGOCD_K8S_FILE_NAME}.j2 -o ./${ARGOCD_K8S_FILE_NAME}
    fi

.prepare_argocd_app_files:
  script:
    - echo $VARS_DATA > VARS_DATA.json
    - ENV_NAME_LOWER=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    - *generate-argocd-template-files
    - *generate-argocd-chart-files
    - *generate-argocd-values-files

.sync_argocd_app_files:
  script:
    - echo "===== SYNC ARGOCD APP FILES ... ====="

    - |
      echo "Cloning ArgoCD repository..."
      ARGOCD_REPO_HOST=$(echo $ARGOCD_REPO_URL | sed 's|https://||')
      git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${ARGOCD_REPO_HOST} $ARGOCD_ROOT_FOLDER
      cd $ARGOCD_ROOT_FOLDER
      echo "Switching to branch: $ARGOCD_TARGET_REVISION..."
      git switch $ARGOCD_TARGET_REVISION

    - ENV_NAME_LOWER=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    - |
      APPLICATION_ROOT_FOLDER=applications/templates
      if [ ! -d "$APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME" ];
      then
        echo "Creating secret template folder: $APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME"
        mkdir -p "$APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME"
      fi
      echo "Copying $ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME to $APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/${ENV_NAME_LOWER/[0-9]/}.yaml..."
      cp ../$ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME "$APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/${ENV_NAME_LOWER/[0-9]/}.yaml"

      if [ ! -d "$APPLICATION_ROOT_FOLDER/$APPLICATION_PATH" ];
      then
        echo "Creating application template folder: $APPLICATION_ROOT_FOLDER/$APPLICATION_PATH..."
        mkdir -p "$APPLICATION_ROOT_FOLDER/$APPLICATION_PATH"
      fi
      echo "Copying $ARGOCD_APP_TEMPLATE_FILE_NAME to $APPLICATION_ROOT_FOLDER/$APPLICATION_PATH/${ENV_NAME_LOWER}.yaml..."
      cp ../$ARGOCD_APP_TEMPLATE_FILE_NAME "$APPLICATION_ROOT_FOLDER/$APPLICATION_PATH/${ENV_NAME_LOWER}.yaml"      

    - |
      CHART_ROOT_FOLDER=charts
      if [ ! -d "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME" ];
      then
        echo "Creating secret chart folder: $CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME..."
        mkdir -p "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME"
      fi
      echo "Copying $ARGOCD_SECRET_APP_CHART_FILE_NAME to $CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/Chart.yaml..."
      cp ../$ARGOCD_SECRET_APP_CHART_FILE_NAME "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/Chart.yaml"
      echo "Copying $ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME to $CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/values-${ENV_NAME_LOWER/[0-9]/}.yaml..."
      cp ../$ARGOCD_IMAGE_PULL_SECRETS_FILE_NAME "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/values-${ENV_NAME_LOWER/[0-9]/}.yaml"

      if [ ! -d "$CHART_ROOT_FOLDER/$APPLICATION_PATH" ];
      then
        echo "Creating application chart folder: $CHART_ROOT_FOLDER/$APPLICATION_PATH..."
        mkdir -p "$CHART_ROOT_FOLDER/$APPLICATION_PATH"
      fi
      echo "Copying $ARGOCD_APP_CHART_FILE_NAME to $CHART_ROOT_FOLDER/$APPLICATION_PATH/Chart.yaml..."
      cp ../$ARGOCD_APP_CHART_FILE_NAME "$CHART_ROOT_FOLDER/$APPLICATION_PATH/Chart.yaml"
      echo "Copying $ARGOCD_K8S_FILE_NAME to $CHART_ROOT_FOLDER/$APPLICATION_PATH/values-${ENV_NAME_LOWER}.yaml..."
      cp ../$ARGOCD_K8S_FILE_NAME "$CHART_ROOT_FOLDER/$APPLICATION_PATH/values-${ENV_NAME_LOWER}.yaml"

    - |
      if [ -n "$(git status --porcelain)" ];
      then
        echo "===== PUSHING TO ARGOCD REPO ... ====="
        git config user.email $ROCKETOR_GIT_EMAIL
        git config user.name $ROCKETOR_GIT_USER
        git add -A
        git commit -m "[${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER}] $CI_COMMIT_MESSAGE"
        
        MAX_RETRIES=3
        RETRY_COUNT=0
        while [ $RETRY_COUNT -lt $MAX_RETRIES ];
        do
          echo "Pulling latest changes from remote repository..."
          git pull origin $ARGOCD_TARGET_REVISION --rebase
          echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES to push changes..."
          if git push origin $ARGOCD_TARGET_REVISION;
          then
            break
          else
            RETRY_COUNT=$((RETRY_COUNT + 1))
          fi
        done
      else
        echo "===== NO CHANGES DETECTED. SKIPPING COMMIT AND PUSH. ====="
      fi
    
    - |
      echo "===== SYNC ARGOCD APP ... ====="
      echo "Logging into Argo CD..."
      argocd login $ARGOCD_HOST --username $ARGOCD_USERNAME --password $ARGOCD_PASSWORD --insecure --grpc-web

      echo "Creating ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/} if not exists..."
      argocd app create -f "../$ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME" --upsert --grpc-web
      echo "Checking if ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/} needs sync..."
      if ! argocd app diff "${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/}" --refresh --grpc-web --exit-code; then
        echo "Changes detected. Triggering sync ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/}..."
        argocd app sync ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/} --grpc-web
      else
        echo "No manifest changes. Skipping sync for ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/}."
      fi
      echo "Waiting for ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/} sync + healthy status..."
      argocd app wait ${STACK_NAME}-${IMAGE_PULL_SECRETS_CHART_NAME}-${ENV_NAME_LOWER/[0-9]/} --health --sync --timeout $ARGOCD_SYNC_TIMEOUT --grpc-web

      echo "Creating ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER} if not exists..."
      argocd app create -f "../$ARGOCD_APP_TEMPLATE_FILE_NAME" --upsert --grpc-web
      echo "Checking if ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER} needs sync..."
      if ! argocd app diff "${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER}" --refresh --grpc-web --exit-code;
      then
        echo "Changes detected. Triggering sync ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER}..."
        argocd app sync ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER} --grpc-web
      else
        echo "No manifest changes. Skipping sync for ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER}."
      fi
      echo "Waiting for ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER} sync + healthy status..."
      argocd app wait ${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER} --health --sync --timeout $ARGOCD_SYNC_TIMEOUT --grpc-web

.deploy_k8s:
  script:
    - echo "===== DEPLOYING K8S RESOURCES ... =====";
    - |
      RELEASE_NAME=${SERVICE_NAME}_${DEPLOY_ENV/_/}
      echo $RELEASE_NAME
      CHART_BASE_URL=oci://${REGISTRY_IMAGE}/charts
      echo $CHART_BASE_URL
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        CONFIG_DEST_FILE_NAME=configs/$CONFIG_DEST_FILE
      fi
      echo $CONFIG_DEST_FILE_NAME
      if [ ! -z "$SP_FILE_NAME" ];
      then
        SP_DEST_FILE_NAME=configs/$SP_FILE_NAME.$SP_FILE_EXTENSION
      fi
      echo $SP_DEST_FILE_NAME
    - curl --retry-max-time 60 --retry 1 --fail --no-progress-meter -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F workingDirectory=$WORKING_PATH -F releaseName=$RELEASE_NAME -F chartBaseUrl=$CHART_BASE_URL -F chartVersion=1.3.1 -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F configFileName=$CONFIG_DEST_FILE_NAME -F spFileName=$SP_DEST_FILE_NAME -F namespace=$STACK_NAME $DEPLOYMENT_API/deployKubernetes?token=$DEPLOY_API_TOKEN;

.update_k8s_ingress:
  script:
    - echo "===== UPDATING K8S INGRESS ... =====";
    - |
      RELEASE_NAME=${SERVICE_NAME}_${DEPLOY_ENV/_/}
      echo $RELEASE_NAME
      CHART_BASE_URL=oci://${REGISTRY_IMAGE}/charts
      echo $CHART_BASE_URL
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        CONFIG_DEST_FILE_NAME=configs/$CONFIG_DEST_FILE
      fi
      echo $CONFIG_DEST_FILE_NAME
      if [ ! -z "$SP_FILE_NAME" ];
      then
        SP_DEST_FILE_NAME=configs/$SP_FILE_NAME.$SP_FILE_EXTENSION
      fi
      echo $SP_DEST_FILE_NAME
    - curl --retry-max-time 60 --retry 1 --fail --no-progress-meter -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F workingDirectory=$WORKING_PATH -F releaseName=$RELEASE_NAME -F chartBaseUrl=$CHART_BASE_URL -F chartVersion=1.3.1 -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F configFileName=$CONFIG_DEST_FILE_NAME -F spFileName=$SP_DEST_FILE_NAME -F namespace=$STACK_NAME -F enableIngress=$ENABLE_INGRESS $DEPLOYMENT_API/updateIngress?token=$DEPLOY_API_TOKEN;
