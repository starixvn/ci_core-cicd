include:
  - cd/deploy/_shared/_base.yml
  - cd/deploy/_shared/_argocd.yml

.base_deploy_stack_swarm:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.login-registry, script]
    - !reference [.generate-and-sync-docker-compose, script]
    - !reference [.sync-config, script]
    - !reference [.remove-old-swarm-configs, script]
    - !reference [.deploy-swarm-service, script]
  tags:
    - docker

.base_deploy_k8s:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_k8s_deployments_values, script]
    - !reference [.sync-config, script]
    - !reference [.deploy_k8s, script]
  tags:
    - docker

.base_deploy_k8s_argocd:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_argocd_app_file, script]
    - !reference [.deploy_argocd_application, script]
  tags:
    - docker

.base_update_k8s_ingress:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_k8s_deployments_values, script]
    - !reference [.update_k8s_ingress, script]
  tags:
    - docker

.base_update_k8s_ingress_argocd:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_argocd_values_file, script]
    - !reference [.update_k8s_ingress_argocd, script]
  tags:
    - docker

.base_sync_argocd_app:
  stage: deploy
  extends:
    - .env
  script:
    - !reference [.prepare_argocd_values_file, script]
    - !reference [.sync_argocd_application, script]
  tags:
    - docker

.base_sync_argocd_shared_configmaps_app:
  stage: deploy
  script:
    - !reference [.prepare_argocd_shared_configmaps_values_file, script]
    - !reference [.sync_argocd_shared_configmaps_application, script]
  tags:
    - docker