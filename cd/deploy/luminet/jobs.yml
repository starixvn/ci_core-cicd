include:
  - cd/deploy/_shared/_vars.yml
  - cd/deploy/luminet/_definition.yml

deploy_swarm:
  extends:
    - .base_deploy_stack_swarm
  rules:
    - !reference [.cd_rules, deploy_swarm]
    - !reference [.cd_rules, deploy]

deploy_k8s:
  extends:
    - .base_deploy_k8s
  rules:
    - !reference [.cd_rules, deploy_k8s]
    - !reference [.cd_rules, deploy]

update_k8s_ingress:
  extends:
    - .base_update_k8s_ingress
  rules:
    - !reference [.cd_rules, deploy_k8s]
    - !reference [.cd_rules, update_k8s_ingress]