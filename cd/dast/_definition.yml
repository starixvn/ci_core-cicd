.zap_scan:
  variables:
    #Defect Dojo Variable
    DEFECTDOJO_SCAN_TEST_TYPE: "ZAP Scan"
    DEFECTDOJO_SCAN_FILE: "zap-report.xml"
    DEFECTDOJO_SCAN_TYPE: "ZAP Scan"
  stage: dast
  image: $DOCKER_REG_LOCAL_URL/docker-hub/zaproxy/zap-stable:2.16.1
  before_script:
    - echo "Starting ZAP scan preparation"
    - echo "Target URL - $APP_URL"
    - echo "Full scan enabled - $ZAP_FULL_SCAN_ENABLED"
    - echo "Extract site_url from APP_URL for DefectDojo naming"
    - export site_url=$(echo "$APP_URL" | sed 's|^https\?://||' | sed 's|/.*||')
    - echo "Extracted site_url for DefectDojo: $site_url"
  script:
    - echo "Checking APP_URL availability..."
    - echo "APP_URL = $APP_URL"
    - |
      if [ -z "$APP_URL" ] || [ "$APP_URL" = "http://" ] || [ "$APP_URL" = "https://" ]; then
        echo "❌ APP_URL is empty or invalid: '$APP_URL'"
        echo "Cannot perform DAST scan without valid target URL"
        echo "Skipping ZAP scan..."
        exit 0
      else
        echo "✅ APP_URL is valid: $APP_URL"
        echo "Checking if the target is reachable..."
        
        # Prepare ZAP workspace
        mkdir -p /zap/wrk
        ln -s "$CI_PROJECT_DIR" /zap/wrk

        # Run ZAP scan with error handling
        ZAP_EXIT_CODE=0
        if [ "$ZAP_FULL_SCAN_ENABLED" = "true" ]; then
          echo "Starting ZAP FULL scan..."
          zap-full-scan.py -t "$APP_URL" -x zap-report.xml -I || ZAP_EXIT_CODE=$?
        else
          echo "Starting ZAP baseline scan..."
          zap-baseline.py -t "$APP_URL" -x zap-report.xml -I || ZAP_EXIT_CODE=$?
        fi
        
        # Check ZAP scan results
        if [ $ZAP_EXIT_CODE -eq 0 ]; then
          echo "✅ ZAP scan completed successfully"
        elif [ $ZAP_EXIT_CODE -eq 1 ]; then
          echo "⚠️  ZAP scan completed with warnings (found issues)"
        elif [ $ZAP_EXIT_CODE -eq 2 ]; then
          echo "❌ ZAP scan failed with errors"
        else
          echo "❌ ZAP scan failed with exit code: $ZAP_EXIT_CODE"
        fi
        
        # Copy report to project directory with error handling
        if [ -f "/zap/wrk/zap-report.xml" ]; then
          echo "✅ ZAP report found, copying to project directory..."
          cp /zap/wrk/zap-report.xml "$CI_PROJECT_DIR/" || {
            echo "❌ Failed to copy ZAP report"
            exit 1
          }
        else
          echo "❌ ZAP report not found, creating empty report..."
          echo '<?xml version="1.0"?><OWASPZAPReport></OWASPZAPReport>' > "$CI_PROJECT_DIR/zap-report.xml"
        fi
      fi
    - !reference [.defectdojo_upload, script]
  tags:
    - docker