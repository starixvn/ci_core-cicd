include:
  - cd/build_docker/linux/report_defectdojo/_definition.yml
  # - cd/build_docker/linux/report_defectdojo/_vars.yml
  - cd/dast/_definition.yml
  - cd/dast/_vars.yml


dast:
  extends:
    - .zap_scan
  needs:
    - job: prepare_vars
      artifacts: true
    - job: deploy_k8s_argocd
      optional: true
    - job: deploy_swarm
      optional: true
    - job: deploy_k8s
      optional: true
    - job: deploy_multi_clusters
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/ && $DEPLOY_BY == "rocketor"'
      when: on_success
    - when: never