.if_deploy_rocketor: &if_deploy_rocketor
  if: '$CI_COMMIT_TAG =~ /^deploy-/ && $DEPLOY_BY == "rocketor"'

.if_update_k8s_ingress: &if_update_k8s_ingress
  if: '$CI_COMMIT_TAG =~ /^update-ingress-/ && $DEPLOY_BY == "rocketor"'

.if_sync_argocd_app: &if_sync_argocd_app
  if: '$CI_COMMIT_TAG =~ /^sync-argo-app-/ && $DEPLOY_BY == "rocketor"'

.cd_success_rules: &cd_success_rules
  - <<: *if_deploy_rocketor
    when: on_success

.cd_always_rules: &cd_always_rules
  - <<: *if_deploy_rocketor
    when: always

.if_multi_stage: &if_multi_stage
  if: $MULTI_STAGE == "true"

.if_not_multi_stage: &if_not_multi_stage
  if: $MULTI_STAGE != "true"

.if_multiple_image_env: &if_multiple_image_env
  if: $MULTIPLE_IMAGE_ENV == "true"

.if_not_multiple_image_env: &if_not_multiple_image_env
  if: $MULTIPLE_IMAGE_ENV != "true"

.if_platform_not_linux: &if_platform_not_linux
  if: $BUILD_PLATFORM != "linux"

.if_platform_not_windows: &if_platform_not_windows
  if: $BUILD_PLATFORM != "windows"

.if_not_build_cocos: &if_not_build_cocos
  if: $BUILD_COCOS != "true"

.if_not_transform_config: &if_not_transform_config
  if: $ENABLE_TRANSFORM_CONFIG != "true"

.if_env_not_prod: &if_env_not_prod
  if: $ENV_NAME != "PROD"

.if_not_sync_tolgee: &if_not_sync_tolgee
  if: $SYNC_TOLGEE != "true"

.if_not_deploy_swarm: &if_not_deploy_swarm
  if: $ORCHESTRATION != "swarm"

.if_not_deploy_k8s: &if_not_deploy_k8s
  if: $ORCHESTRATION != "k8s"

.if_argo_cluster: &if_argo_cluster
  if: $ARGO_CLUSTER != ""

.if_not_argo_cluster: &if_not_argo_cluster
  if: $ARGO_CLUSTER == ""

.if_multi_clusters: &if_multi_clusters
  if: $MULTI_CLUSTER == "true"

.if_not_multi_clusters: &if_not_multi_clusters
  if: $MULTI_CLUSTER != "true"

.if_child_pipeline: &if_child_pipeline
  if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'

.if_publish_npm: &if_publish_npm
  if: $PUBLISH_NPM == "true"

.if_not_publish_npm: &if_not_publish_npm
  if: $PUBLISH_NPM != "true"

.if_publish_nuget: &if_publish_nuget
  if: $PUBLISH_NUGET == "true"

.if_not_publish_nuget: &if_not_publish_nuget
  if: $PUBLISH_NUGET != "true"

.if_value_exists: &if_value_exists
  if: $site_url != null && $site_url != ""

.if_value_not_exists: &if_value_not_exists
  if: $site_url == null || $site_url == "" 

.cd_rules:
  build_multistage:
    - <<: *if_not_multi_stage
      when: never
  build_no_multistage:
    - <<: *if_multi_stage
      when: never
  build_env:
    - <<: *if_not_multiple_image_env
      when: never
  build_noenv:
    - <<: *if_multiple_image_env
      when: never
  build_linux:
    - <<: *if_platform_not_linux
      when: never
  build_windows:
    - <<: *if_platform_not_windows
      when: never
  build_cocos:
    - <<: *if_not_build_cocos
      when: never
  transform_config:
    - <<: *if_not_transform_config
      when: never
  sync_tolgee:
    - <<: *if_not_sync_tolgee
      when: never
  prepare:
    - *cd_always_rules
    - <<: *if_update_k8s_ingress
      when: always
    - <<: *if_sync_argocd_app
      when: always
  prepare_cd_jobs:
    - <<: *if_not_multi_clusters
      when: never
    - <<: *if_child_pipeline
      when: never
    - *cd_always_rules
  deploy:
    - *cd_success_rules
  deploy_swarm:
    - <<: *if_multi_clusters
      when: never
    - <<: *if_not_deploy_swarm
      when: never
  deploy_k8s:
    - <<: *if_multi_clusters
      when: never
    - <<: *if_not_deploy_k8s
      when: never
    - <<: *if_argo_cluster
      when: never
  deploy_k8s_argocd:
    - <<: *if_multi_clusters
      when: never
    - <<: *if_not_deploy_k8s
      when: never
    - <<: *if_not_argo_cluster
      when: never
  update_k8s_ingress:
    - <<: *if_update_k8s_ingress
      when: on_success
    - <<: *if_argo_cluster
      when: never
  update_k8s_ingress_argocd:
    - <<: *if_update_k8s_ingress
      when: on_success
    - <<: *if_not_argo_cluster
      when: never
  sync_argocd_app:
    - <<: *if_sync_argocd_app
      when: on_success
    - <<: *if_not_argo_cluster
      when: never
  deploy_multi_clusters:
    - <<: *if_not_multi_clusters
      when: never
  cleanup:
    - <<: *if_multi_clusters
      when: never
    - *cd_always_rules
    - <<: *if_update_k8s_ingress
      when: always
    - <<: *if_sync_argocd_app
      when: always
  smoke_test:
    - <<: *if_env_not_prod
      when: never
  
  dast:
    - if: $site_url == null || $site_url == ""
      when: never
    - if: $site_url != null && $site_url != ""
      when: on_success

  publish_npm:
    - <<: *if_not_publish_npm
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
  publish_nuget:
    - <<: *if_not_publish_nuget
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - $PROJECT_FOLDER/**/*.csproj

.trigger_cd_rules:
  rules:
    - <<: *if_publish_npm
      when: never
    - <<: *if_publish_nuget
      when: never
    - if: $ENABLE_SONAR_SQL == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE != "push"
      when: never
    - if: $CI_COMMIT_BRANCH
      when: always
