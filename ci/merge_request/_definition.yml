.create_mr:
  stage: mr
  tags:
    - ci
  needs: []
  before_script: []
  script:
    - |
      # Check if commit message contains #mr or if there's a tag starting with #mr-
      if [[ "$CI_COMMIT_MESSAGE" =~ \#mr ]] || [[ "$CI_COMMIT_TAG" =~ ^\#mr- ]]; then
        echo "Auto-creating merge request..."

        # Determine source branch
        if [[ "$CI_COMMIT_TAG" =~ ^\#mr-(.+)$ ]]; then
          # Get branch name from commit hash
          git fetch --all --tags
          echo "Getting branch name from commit hash: $CI_COMMIT_SHA"
          SOURCE_BRANCH=$(git branch -r --contains $CI_COMMIT_SHA | head -1 | sed 's/origin\///' | xargs)
          echo "Source branch: $SOURCE_BRANCH"
        else
          SOURCE_BRANCH="$CI_COMMIT_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"
        fi

        # Create merge request using GitLab API
        curl --request POST \
          --header "PRIVATE-TOKEN: $BOT_MR_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{
            \"source_branch\": \"$SOURCE_BRANCH\",
            \"target_branch\": \"$CI_DEFAULT_BRANCH\",
            \"title\": \"Review MR: $SOURCE_BRANCH\",
            \"remove_source_branch\": true
          }" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests"
        
        echo "Merge request creation attempted"
      else
        echo "No #mr tag found in commit message or tag, skipping merge request creation"
      fi
  allow_failure: true