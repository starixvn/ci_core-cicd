.ci_never_rules: &ci_never_rules
  - if: '$CI_COMMIT_TAG =~ /^deploy-/'
    when: never
  - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
    when: never

.ci_always_rules: &ci_always_rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH'

.if_enable_test_dotnet: &if_enable_test_dotnet
  if: $ENABLE_TEST_DOTNET == "true"

.if_disable_test_dotnet: &if_disable_test_dotnet
  if: $ENABLE_TEST_DOTNET != "true"

.if_enable_test_js: &if_enable_test_js
  if: $ENABLE_TEST_JS == "true"

.if_disable_test_js: &if_disable_test_js
  if: $ENABLE_TEST_JS != "true"

.if_disable_test_cocos: &if_disable_test_cocos
  if: $ENABLE_TEST_COCOS != "true"

.if_child_pipeline: &if_child_pipeline
  if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'

.ci_rules:
  test_js:
    - *ci_never_rules
    - <<: *if_disable_test_js
      when: never
    - *ci_always_rules
  test_dotnet:
    - *ci_never_rules
    - <<: *if_disable_test_dotnet
      when: never
    - *ci_always_rules
  test_cocos:
    - *ci_never_rules
    - <<: *if_disable_test_cocos
      when: never
    - <<: *if_child_pipeline
      when: never
    - *ci_always_rules
  sonar_check_js:
    - *ci_never_rules
    - <<: *if_disable_test_js
      when: never
    - <<: *if_enable_test_dotnet
      when: never
    - *ci_always_rules
  sonar_check_dotnet:
    - *ci_never_rules
    - <<: *if_disable_test_dotnet
      when: never
    - <<: *if_enable_test_js
      when: never
    - *ci_always_rules
  sonar_check_dotnet_js:
    - *ci_never_rules
    - <<: *if_disable_test_js
      when: never
    - <<: *if_disable_test_dotnet
      when: never
    - *ci_always_rules
  integration_test_js:
    - *ci_never_rules
    - if: $ENABLE_NODEJS_INTEGRATION_TEST != "true"
      when: never
    - *ci_always_rules
  scan_dockerfile:
    - *ci_never_rules
    - <<: *if_child_pipeline
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH'
      changes:
        - "*ockerfile"
        - "*/*ockerfile"