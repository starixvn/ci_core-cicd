.login-registry:
  script:
    - echo "$REGISTRY_IMAGE"
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F registryUrl=$REGISTRY_IMAGE $DEPLOYMENT_API/loginRegistry?token=$DEPLOY_API_TOKEN

.generate-and-sync-docker-compose:
  script:
    - echo "$DEPLOYMENT_API - $SERVER_USER"
    - echo "===== GENERATE docker-compose.yml ... =====";
    - echo $VARS_DATA > VARS_DATA.json
    - curl --fail -o ${DOCKER_COMPOSE_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$DOCKER_COMPOSE_FILE_PATH/raw?ref=$DOCKER_COMPOSE_REF
    - sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${DOCKER_COMPOSE_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${DOCKER_COMPOSE_FILE_NAME}.j2 -o ./${DOCKER_COMPOSE_FILE_NAME}
    - sed -i "s/@CONFIG_VERSION/$(date +%s)/g" $DOCKER_COMPOSE_FILE_NAME
    - sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" $DOCKER_COMPOSE_FILE_NAME
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" $DOCKER_COMPOSE_FILE_NAME
    - sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" $DOCKER_COMPOSE_FILE_NAME
    - cat $DOCKER_COMPOSE_FILE_NAME
    - echo "===== SYNC docker-compose.yml ... ====="
    - echo "Remote path --> $WORKING_PATH/$DEPLOY_ENV/docker-compose.yml"    
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F remotePath="$WORKING_PATH/$DEPLOY_ENV/docker-compose.yml" -F file=@"$DOCKER_COMPOSE_FILE_NAME" $DEPLOYMENT_API/scp?token=$DEPLOY_API_TOKEN

.sync-config:
  script:
    - echo $CONFIG_FILE_PATH/$CONFIG_FILE
    - ls -l $CONFIG_FILE_PATH
    - echo $TRANSFORM_CONFIG
    - if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        echo "===== SYNC $CONFIG_FILE ... =====";
        curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F remotePath="$WORKING_PATH/$DEPLOY_ENV/configs/$CONFIG_DEST_FILE" -F file=@"$CONFIG_FILE_PATH/$CONFIG_FILE" $DEPLOYMENT_API/scp?token=$DEPLOY_API_TOKEN;      
      fi

.remove-old-swarm-configs:
  script:
    - echo "===== REMOVING OLD CONFIGS ... =====";   
    - if [ ! -z "$CONFIG_FILE_NAME" ];
      then 
        curl -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F configName=${SERVICE_NAME}_${DEPLOY_ENV}_config $DEPLOYMENT_API/removeSwarmConfigs?token=$DEPLOY_API_TOKEN;        
      fi

.deploy-swarm-service:
  script:
    - echo "===== DEPLOYING SERVICE ... =====";
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F workingDirectory=$WORKING_PATH -F stack=$STACK_NAME $DEPLOYMENT_API/deploySwarmService?token=$DEPLOY_API_TOKEN;   

.prepare_k8s_deployments_values:
  script:
    - echo "===== GENERATE k8sdeployments-values.yaml ... =====";
    - echo $VARS_DATA > VARS_DATA.json
    - curl --fail -o ${K8S_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$K8S_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${K8S_FILE_NAME}.j2
    - sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${K8S_FILE_NAME}.j2
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${K8S_FILE_NAME}.j2
    - sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${K8S_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${K8S_FILE_NAME}.j2 -o ./${K8S_FILE_NAME}
    - cat $K8S_FILE_NAME
    - echo "===== SYNC k8sdeployments-values.yaml ... ====="
    - echo "Remote path --> $WORKING_PATH/$DEPLOY_ENV/$K8S_FILE_NAME"    
    - curl --retry-max-time 60 --retry 1 --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F remotePath="$WORKING_PATH/$DEPLOY_ENV/$K8S_FILE_NAME" -F file=@"$K8S_FILE_NAME" $DEPLOYMENT_API/scp?token=$DEPLOY_API_TOKEN

.prepare_argocd_app_files:
  script:
    - echo $VARS_DATA > VARS_DATA.json
    - ENV_NAME_LOWER=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')

    - echo "===== GENERATE $ARGOCD_APP_TEMPLATE_FILE_NAME for secret ... =====";
    - curl --fail -o ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_TEMPLATE_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s/@APP_NAME/imagepullsecrets/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s/@STACK_NAME/$STACK_NAME/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s/@ENV_NAME/${ENV_NAME_LOWER/[0-9]/}/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s|@DEST_NAME|${ENV_NAME_LOWER/[0-9]/}|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s|@SRC_PATH|$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s|@SRC_REPO_URL|$ARGOCD_REPO_URL|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s/@SRC_TARGET_REVISION/$ARGOCD_TARGET_REVISION/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 -o ./${ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME}
    - cat $ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME

    - echo "===== GENERATE $ARGOCD_APP_TEMPLATE_FILE_NAME for application ... =====";
    - curl --fail -o ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_TEMPLATE_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s/@APP_NAME/$APP_NAME/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s/@STACK_NAME/$STACK_NAME/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s/@ENV_NAME/${ENV_NAME_LOWER}/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s|@DEST_NAME|${ENV_NAME_LOWER/[0-9]/}|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s|@SRC_PATH|$APPLICATION_PATH|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s|@SRC_REPO_URL|$ARGOCD_REPO_URL|g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - sed -i "s/@SRC_TARGET_REVISION/$ARGOCD_TARGET_REVISION/g" ${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_TEMPLATE_FILE_NAME}.j2 -o ./${ARGOCD_APP_TEMPLATE_FILE_NAME}
    - cat $ARGOCD_APP_TEMPLATE_FILE_NAME

    - echo "===== GENERATE $ARGOCD_APP_CHART_FILE_NAME for secret ... =====";
    - curl --fail -o ${ARGOCD_APP_CHART_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_CHART_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s/@APP_NAME/imagepullsecrets/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - sed -i "s/@DEP_NAME/imagepullsecrets/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - sed -i "s/@DEP_VERSION/1.0.0/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2 -o ./${ARGOCD_SECRET_APP_CHART_FILE_NAME}
    - cat $ARGOCD_SECRET_APP_CHART_FILE_NAME

    - echo "===== GENERATE $ARGOCD_APP_CHART_FILE_NAME for application ... =====";
    - curl --fail -o ${ARGOCD_APP_CHART_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$ARGOCD_APP_CHART_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s/@APP_NAME/$APP_NAME/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - sed -i "s/@DEP_NAME/k8sdeployments/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - sed -i "s/@DEP_VERSION/1.3.1/g" ${ARGOCD_APP_CHART_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${ARGOCD_APP_CHART_FILE_NAME}.j2 -o ./${ARGOCD_APP_CHART_FILE_NAME}
    - cat $ARGOCD_APP_CHART_FILE_NAME

    - echo "===== GENERATE $IMAGE_PULL_SECRETS_FILE_NAME ... =====";
    - curl --fail -o ${IMAGE_PULL_SECRETS_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$IMAGE_PULL_SECRETS_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${IMAGE_PULL_SECRETS_FILE_NAME}.j2
    - sed -i "s/@REGISTRY_USERNAME/$DOCKER_REG_LOCAL_USERNAME/g" ${IMAGE_PULL_SECRETS_FILE_NAME}.j2
    - sed -i "s/@REGISTRY_PASSWORD/$DOCKER_REG_LOCAL_PASSWORD/g" ${IMAGE_PULL_SECRETS_FILE_NAME}.j2
    - jinja render -d ./VARS_DATA.json -t ./${IMAGE_PULL_SECRETS_FILE_NAME}.j2 -o ./${IMAGE_PULL_SECRETS_FILE_NAME}
    - cat $IMAGE_PULL_SECRETS_FILE_NAME

    - echo "===== GENERATE $K8S_FILE_NAME ... =====";
    - curl --fail -o ${K8S_FILE_NAME}.j2 --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/ci%2fcore-cicd/repository/files/$K8S_FILE_PATH/raw?ref=$K8S_REF
    - sed -i "s|@REGISTRY_IMAGE|$REGISTRY_IMAGE|g" ${K8S_FILE_NAME}.j2
    - sed -i "s/@DEPLOY_ENVIRONMENT/$ENV_NAME/g" ${K8S_FILE_NAME}.j2
    - sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" ${K8S_FILE_NAME}.j2
    - sed -i "s|@COMMIT_HASH|$CI_COMMIT_SHORT_SHA|g" ${K8S_FILE_NAME}.j2
    - |
      if [ ! -z "$SP_FILE_NAME" ];
      then
        if [ "$SP_FILE_TRANSFORM" == "true" ];
        then
          export SP_FILE=$SP_FILE_NAME.${TRANSFORM_CONFIG}.$SP_FILE_EXTENSION;
        else
          export SP_FILE=$SP_FILE_NAME.$SP_FILE_EXTENSION;
        fi
        if [ ! -z "$REDMINE_IDS" ];
        then
          echo "===== CHANGE SP VERSION FOR $SP_FILE ... =====";
          if curl --fail -o sp-result.xml -F file=@"$SP_FILE_PATH/$SP_FILE" -F "redmineIds=$REDMINE_IDS" -X POST $ROCKETOR_API_URL/Home/ChangeSpVersion; then
            cp sp-result.xml "$SP_FILE_PATH/$SP_FILE";
            echo "It's done";
          fi
        fi
        awk -v sp_content="$(< "$SP_FILE_PATH/$SP_FILE")" \
          '{gsub(/@SP_CONTENT/, sp_content); print}' \
          "${K8S_FILE_NAME}.j2" > "${K8S_FILE_NAME}.j2.tmp" \
          && mv "${K8S_FILE_NAME}.j2.tmp" "${K8S_FILE_NAME}.j2"
      fi
    - |
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        jinja render -d ./VARS_DATA.json -t ./${K8S_FILE_NAME}.j2 -o ./${K8S_FILE_NAME} -e "config_content='$(< "$CONFIG_FILE_PATH/$CONFIG_FILE")'"
      else
        jinja render -d ./VARS_DATA.json -t ./${K8S_FILE_NAME}.j2 -o ./${K8S_FILE_NAME}
      fi
    - cat $K8S_FILE_NAME

.sync_argocd_app_files:
  script:
    - echo "===== SYNC ARGOCD APP FILES ... ====="

    - |
      echo "Cloning ArgoCD repository..."
      ARGOCD_HOST=$(echo $ARGOCD_REPO_URL | sed 's|https://||')
      git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@${ARGOCD_HOST} $ARGOCD_ROOT_FOLDER
      cd $ARGOCD_ROOT_FOLDER
      echo "Switching to branch: $ARGOCD_TARGET_REVISION..."
      git switch $ARGOCD_TARGET_REVISION

    - ENV_NAME_LOWER=$(echo ${DEPLOY_ENV} | tr '[:upper:]' '[:lower:]' | sed 's/_//g')
    - |
      APPLICATION_ROOT_FOLDER=applications/templates
      if [ ! -d "$APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME" ];
      then
        echo "Creating secret template folder: $APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME"
        mkdir -p "$APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME"
      fi
      echo "Copying $ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME to $APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/${ENV_NAME_LOWER/[0-9]/}.yaml..."
      cp ../$ARGOCD_SECRET_APP_TEMPLATE_FILE_NAME "$APPLICATION_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/${ENV_NAME_LOWER/[0-9]/}.yaml"

      if [ ! -d "$APPLICATION_ROOT_FOLDER/$APPLICATION_PATH" ];
      then
        echo "Creating application template folder: $APPLICATION_ROOT_FOLDER/$APPLICATION_PATH..."
        mkdir -p "$APPLICATION_ROOT_FOLDER/$APPLICATION_PATH"
      fi
      echo "Copying $ARGOCD_APP_TEMPLATE_FILE_NAME to $APPLICATION_ROOT_FOLDER/$APPLICATION_PATH/${ENV_NAME_LOWER}.yaml..."
      cp ../$ARGOCD_APP_TEMPLATE_FILE_NAME "$APPLICATION_ROOT_FOLDER/$APPLICATION_PATH/${ENV_NAME_LOWER}.yaml"      

    - |
      CHART_ROOT_FOLDER=charts
      if [ ! -d "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME" ];
      then
        echo "Creating secret chart folder: $CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME..."
        mkdir -p "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME"
      fi
      echo "Copying $ARGOCD_SECRET_APP_CHART_FILE_NAME to $CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/Chart.yaml..."
      cp ../$ARGOCD_SECRET_APP_CHART_FILE_NAME "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/Chart.yaml"
      echo "Copying $IMAGE_PULL_SECRETS_FILE_NAME to $CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/values-${ENV_NAME_LOWER/[0-9]/}.yaml..."
      cp ../$IMAGE_PULL_SECRETS_FILE_NAME "$CHART_ROOT_FOLDER/$ARGOCD_SECRET_ROOT_FOLDER/$STACK_NAME/values-${ENV_NAME_LOWER/[0-9]/}.yaml"

      if [ ! -d "$CHART_ROOT_FOLDER/$APPLICATION_PATH" ];
      then
        echo "Creating application chart folder: $CHART_ROOT_FOLDER/$APPLICATION_PATH..."
        mkdir -p "$CHART_ROOT_FOLDER/$APPLICATION_PATH"
      fi
      echo "Copying $ARGOCD_APP_CHART_FILE_NAME to $CHART_ROOT_FOLDER/$APPLICATION_PATH/Chart.yaml..."
      cp ../$ARGOCD_APP_CHART_FILE_NAME "$CHART_ROOT_FOLDER/$APPLICATION_PATH/Chart.yaml"
      echo "Copying $K8S_FILE_NAME to $CHART_ROOT_FOLDER/$APPLICATION_PATH/values-${ENV_NAME_LOWER}.yaml..."
      cp ../$K8S_FILE_NAME "$CHART_ROOT_FOLDER/$APPLICATION_PATH/values-${ENV_NAME_LOWER}.yaml"

    - |
      if git diff --quiet && git diff --cached --quiet;
      then
        echo "No changes detected. Skipping commit and push."
      else
        echo "Changes detected. Committing and pushing..."
        git config user.email $ROCKETOR_GIT_EMAIL
        git config user.name $ROCKETOR_GIT_USER
        git add -A
        git commit -m "[${STACK_NAME}-${APP_NAME}-${ENV_NAME_LOWER}] $CI_COMMIT_MESSAGE"
        git push origin $ARGOCD_TARGET_REVISION
      fi

.deploy_k8s:
  script:
    - echo "===== DEPLOYING K8S RESOURCES ... =====";
    - |
      RELEASE_NAME=${SERVICE_NAME}_${DEPLOY_ENV/_/}
      echo $RELEASE_NAME
      CHART_BASE_URL=oci://${REGISTRY_IMAGE}/charts
      echo $CHART_BASE_URL
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        CONFIG_DEST_FILE_NAME=configs/$CONFIG_DEST_FILE
      fi
      echo $CONFIG_DEST_FILE_NAME
      if [ ! -z "$SP_FILE_NAME" ];
      then
        SP_DEST_FILE_NAME=configs/$SP_FILE_NAME.$SP_FILE_EXTENSION
      fi
      echo $SP_DEST_FILE_NAME
    - curl --retry-max-time 60 --retry 1 --fail --no-progress-meter -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F workingDirectory=$WORKING_PATH -F releaseName=$RELEASE_NAME -F chartBaseUrl=$CHART_BASE_URL -F chartVersion=1.3.1 -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F configFileName=$CONFIG_DEST_FILE_NAME -F spFileName=$SP_DEST_FILE_NAME -F namespace=$STACK_NAME $DEPLOYMENT_API/deployKubernetes?token=$DEPLOY_API_TOKEN;

.update_k8s_ingress:
  script:
    - echo "===== UPDATING K8S INGRESS ... =====";
    - |
      RELEASE_NAME=${SERVICE_NAME}_${DEPLOY_ENV/_/}
      echo $RELEASE_NAME
      CHART_BASE_URL=oci://${REGISTRY_IMAGE}/charts
      echo $CHART_BASE_URL
      if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        CONFIG_DEST_FILE_NAME=configs/$CONFIG_DEST_FILE
      fi
      echo $CONFIG_DEST_FILE_NAME
      if [ ! -z "$SP_FILE_NAME" ];
      then
        SP_DEST_FILE_NAME=configs/$SP_FILE_NAME.$SP_FILE_EXTENSION
      fi
      echo $SP_DEST_FILE_NAME
    - curl --retry-max-time 60 --retry 1 --fail --no-progress-meter -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F workingDirectory=$WORKING_PATH -F releaseName=$RELEASE_NAME -F chartBaseUrl=$CHART_BASE_URL -F chartVersion=1.3.1 -F registryUser=$DOCKER_REG_LOCAL_USERNAME -F registryPassword=$DOCKER_REG_LOCAL_PASSWORD -F configFileName=$CONFIG_DEST_FILE_NAME -F spFileName=$SP_DEST_FILE_NAME -F namespace=$STACK_NAME -F enableIngress=$ENABLE_INGRESS $DEPLOYMENT_API/updateIngress?token=$DEPLOY_API_TOKEN;
