.scan_build_image:
  script:
    - |
      wget https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/.trivyignore.yml
      wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
      cat .trivyignore.yml
    - ./trivy image --server $TRIVY_SERVER --token $TRIVY_TOKEN --ignore-unfixed --ignorefile .trivyignore.yml --exit-code 0 --scanners vuln --severity HIGH,CRITICAL $BUILD_IMAGE
    - ./trivy image --server $TRIVY_SERVER --token $TRIVY_TOKEN --ignore-unfixed --ignorefile .trivyignore.yml --exit-code 0 --scanners vuln --severity CRITICAL $BUILD_IMAGE  --format json --output ${DEFECTDOJO_SCAN_FILE}
    - !reference [.defectdojo_upload, script]
    - echo $DEFECTDOJO_URL
    - echo $DEFECTDOJO_API_KEY
    - echo $DEFECTDOJO_PRODUCT_NAME
    - echo $DEFECTDOJO_DEPT
    - echo $DEFECTDOJO_TEST_TITLE
    - echo $DEFECTDOJO_ENGAGEMENT_NAME
    - |
      if [ -f "${DEFECTDOJO_SCAN_FILE}" ]; then
        VULN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' ${DEFECTDOJO_SCAN_FILE})
        echo "Found $VULN_COUNT CRITICAL image vulnerabilities"
        if [ "$VULN_COUNT" -gt 0 ] && ! curl -s -H "ROCKETOR-TOKEN:$ROCKETOR_TOKEN" "$ROCKETOR_API_URL/api/Deploy/CanBypassCVE?service=$SERVICE_NAME" | grep -q "true"; then
          echo "❌ CRITICAL image vulnerabilities detected. Skipping push image to registry."
          exit 1
        fi
      fi


.build:default:image:
  stage: build
  script:
    - echo $DOCKER_FILE_PATH
    - docker buildx build
      --cache-to type=inline
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
      --build-arg DEPLOY_ENV=$DEPLOY_ENV
      --build-arg CI_JOB_TOKEN=$CI_JOB_TOKEN
      --build-arg TRANSFORM_CONFIG=$TRANSFORM_CONFIG .
    - export BUILD_IMAGE=$CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
    - !reference [.scan_build_image, script]
    - docker push $CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
    - docker buildx imagetools create -t $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest $CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
  tags:
    - docker

