.review_code:
  stage: review-code
  image:
    name: $QODO_IMAGE
    entrypoint: [""]
  before_script: []
  script:
    - cd /app
    - echo "Running PR Agent action step"
    - export MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/merge_requests/$CI_MERGE_REQUEST_IID"
    - echo "MR_URL=$MR_URL"
    - |    
      export gitlab__url=$CI_SERVER_PROTOCOL://$CI_SERVER_FQDN
      export gitlab__PERSONAL_ACCESS_TOKEN=$QODO_USER_TOKEN
      export config__git_provider="gitlab"
      
      if [ -n "$OPENAI_KEY" ]; then
        echo "Using OpenAI model"
        export config__model="gpt-4o"
        export config__fallback_models='["gpt-4o", "gpt-4o-mini"]'
        export OPENAI__KEY=$OPENAI_KEY
      else
        echo "Using Gemini model"
        export config__model="gemini/gemini-2.5-flash"
        export config__fallback_models='["gemini/gemini-2.5-flash"]'
        export config__custom_model_max_tokens=100000
        export GOOGLE_AI_STUDIO__GEMINI_API_KEY=$GEMINI_API_KEY
      fi
    - |
      python -m pr_agent.cli --pr_url="$MR_URL" describe
      python -m pr_agent.cli --pr_url="$MR_URL" review
      python -m pr_agent.cli --pr_url="$MR_URL" improve