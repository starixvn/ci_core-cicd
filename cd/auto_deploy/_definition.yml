.trigger_cd:
  stage: deploy
  before_script:
    - echo 'Check and trigger CD if the location setting "Auto Deploy Branch" is configured'
    - |
      if [ -n "$CI_COMMIT_BRANCH" ]; then
        BRANCH_NAME="$CI_COMMIT_BRANCH"
      else
        BRANCH_NAME="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      fi
    - echo "$BRANCH_NAME - $CI_PIPELINE_SOURCE"
  script:
    - curl -f --no-progress-meter -H "ROCKETOR-TOKEN:$ROCKETOR_TOKEN" -d CommitHash=$CI_COMMIT_SHA -d "CommitMessage=$CI_COMMIT_MESSAGE" -d "UserName=$GITLAB_USER_LOGIN" -d Branch=$BRANCH_NAME -d "ProjectUrl=$CI_PROJECT_URL" -X POST $ROCKETOR_API_URL/api/Deploy/Trigger
  tags:
    - docker
  allow_failure: true