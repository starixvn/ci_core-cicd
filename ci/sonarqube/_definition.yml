.sonar_common:
  stage: test
  before_script:
    - echo "===========Start Sonar Scanner============="
    - if [ "$PROJECT_NAME" == "" ];
      then
      export PROJECT_NAME=$CI_PROJECT_NAME;
      export SONAR_PROJECT_NAME=$CI_PROJECT_NAME;
      else
      echo "$PROJECT_NAME";
      fi
    - |
      if [ "$SONAR_PROJECT_GROUP" != "" ]; then
        if [[ $PROJECT_NAME != ${SONAR_PROJECT_GROUP}* ]]; then
          export PROJECT_NAME=$SONAR_PROJECT_GROUP-$PROJECT_NAME;
          export SONAR_PROJECT_NAME=$PROJECT_NAME;
          echo $SONAR_PROJECT_NAME;
        else
          export SONAR_PROJECT_NAME=$PROJECT_NAME;
          echo $SONAR_PROJECT_NAME;
        fi
      fi
  allow_failure: false
  tags:
    - ci

.sonar_js:
  extends: .sonar_common
  needs: ["unit_test_js"]
  dependencies:
    - unit_test_js
  image:
    name: $SONAR_SCANNER_CLI_IMAGE
  before_script:
    - !reference [.sonar_common, before_script]
    - echo $SRC_PATH
    - echo $TEST_PATH
  script:
    - sonar-scanner
      -X
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=$PROJECT_NAME
      -Dsonar.projectName="$SONAR_PROJECT_NAME"
      -Dsonar.projectVersion="${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]"
      -Dproject.settings=./sonarqube.analysis.properties
      -Dsonar.javascript.lcov.reportPaths=**/lcov.info
      -Dsonar.sources=${SRC_PATH}
      -Dsonar.tests=${TEST_PATH}
      -Dsonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts

.sonar_dotnet:
  extends: .sonar_common
  needs: ["unit_test_dotnet"]
  dependencies:
    - unit_test_dotnet
  image:
    name: $SONAR_SCANNER_DOTNET_IMAGE
  before_script:
    - !reference [.sonar_common, before_script]
    - export LC_ALL="en_US.UTF-8"
    - export LANG="en_US.UTF-8"
    - dotnet tool install --global dotnet-sonarscanner --version 5.13.1
    - export PATH="$PATH:/root/.dotnet/tools"
    - export NUGET_PACKAGES=$CI_PROJECT_DIR/packages
    - dotnet nuget add source https://nuget.nexdev.net/api/v2
  script:
    - ls
    - dotnet sonarscanner begin /k:$PROJECT_NAME /n:"$SONAR_PROJECT_NAME"
      /v:"${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]"
      /d:sonar.token=$SONAR_TOKEN
      /d:sonar.host.url=$SONAR_HOST_URL
      /d:sonar.qualitygate.wait=true
      /d:sonar.cs.opencover.reportsPaths=**/*.coverage.opencover.xml
      /d:sonar.cs.vstest.reportsPaths=**/*.trx
      /d:sonar.sourceEncoding=UTF-8
    - echo $SOLUTION_NAME
    - dotnet build $SOLUTION_NAME
    - dotnet sonarscanner end /d:sonar.token=$SONAR_TOKEN
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - packages/

.sonar_dotnet_js:
  extends: .sonar_dotnet
  needs: ["unit_test_dotnet", "unit_test_js"]
  dependencies: ["unit_test_dotnet", "unit_test_js"]
  script:
    - ls
    - dotnet sonarscanner begin /k:$PROJECT_NAME /n:"$SONAR_PROJECT_NAME"
      /v:"${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]"
      /d:sonar.token=$SONAR_TOKEN
      /d:sonar.host.url=$SONAR_HOST_URL
      /d:sonar.qualitygate.wait=true
      /d:sonar.cs.opencover.reportsPaths=**/*.coverage.opencover.xml
      /d:sonar.cs.vstest.reportsPaths=**/*.trx
      /d:sonar.javascript.lcov.reportPaths=**/lcov.info
      /d:sonar.sources=${SRC_PATH}
      /d:sonar.tests=${TEST_PATH}
      /d:sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
      /d:sonar.sourceEncoding=UTF-8
    - echo $SOLUTION_NAME
    - dotnet build $SOLUTION_NAME
    - dotnet sonarscanner end /d:sonar.token=$SONAR_TOKEN
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - packages/

.sonar_check:
  extends: .sonar_common
  image:
    name: $SONAR_SCANNER_CLI_IMAGE
  script:
    - sonar-scanner
      -X
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=$PROJECT_NAME
      -Dsonar.projectName="$SONAR_PROJECT_NAME"
      -Dsonar.projectVersion="${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]"
      -Dproject.settings=./sonarqube.analysis.properties
      -Dsonar.sources=.
